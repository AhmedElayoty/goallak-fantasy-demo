<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070B1A">
<title>جولك فانتازي · Goallak Fantasy — DEMO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚽</text></svg>">
<!-- The five design modules, built from modules/*.js by scripts/build-bundle.mjs.
     Sibling files rather than inlined: the sources are 325KB and inlining would take the
     page from 72KB to ~400KB, destroying the load-time advantage that is this product's
     one measured edge. These change rarely and cache independently of index.html. -->
<link rel="stylesheet" href="modules.css">
<style>
/* ============================================================================
   GOALLAK FANTASY — ONE MODE ONLY.
   No light theme, no dark theme, no toggle. Every token is declared here and
   nothing inherits from a themed parent, so the look cannot drift.
   Palette + contrast ratios are from design/fantasy-color.md (all measured).
   ============================================================================ */
:root{
 --fx-bg:#070B1A; --fx-surface:#101736; --fx-surface-2:#182246; --fx-surface-3:#212D57;
 --fx-scrim:rgba(3,5,14,.82);
 --fx-line:#2A3560; --fx-line-2:#3D4C82; --fx-line-3:#55689F;
 --fx-ink:#F2F5FF; --fx-ink-dim:#A9B7E4; --fx-ink-mute:#7C8AB8;
 --fx-gold:#FFC53D; --fx-pos:#3BE07F; --fx-neg:#FF6070; --fx-acc:#FF7A45;
 --fx-live:#35D0F5; --fx-chip:#A77BFF; --fx-urgent:#FF3B5C; --fx-blank:#63719C;
 --t1:#FFD24A; --t2:#FF8A3D; --t3:#7E8CC8; --t4:#49578A; --t5:#2A3560;
 /* LEAGUE COLOURS. Not decoration: 79 pairs of clubs were pixel-identical to each other
    (Juventus and Udinese, Man United and Monza and Brest — dE 0.0 on both colours), because
    78% of the 126 clubs use just two of the nine kit patterns. Measured, a league mark
    separates 70 of those 79 pairs, taking the confusable share from 46.8% to 13.5%; the nine
    that remain are genuine real-world look-alikes (Man United #DA291C vs Forest #DD0000) and
    are carried by the code and the name. It also makes the three-per-league rule visible on
    the pitch, which is the rule players most often break by accident. */
 --lg-epl:#A855F7; --lg-liga:#FF6B00; --lg-seriea:#2E9BFF; --lg-bun:#FF3B3B;
 --lg-fl1:#17D4A7; --lg-tsl:#C7F000; --lg-spl:#FF5CA8;
 /* motion tokens — specified in fantasy-spectacle.md and never added to the build */
 --e-out:cubic-bezier(.22,.61,.36,1); --e-pop:cubic-bezier(.34,1.56,.64,1);
 --r:14px; --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
 background:var(--fx-bg); color:var(--fx-ink);
 font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Arabic",Tahoma,sans-serif;
 font-size:15px; line-height:1.5;
 padding-bottom:78px;
 overflow-x:hidden;
}
body.gk-lock{position:fixed;width:100%;overflow:hidden}
button,input,select{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--fx-gold);outline-offset:2px;border-radius:6px}
.hide{display:none !important}
[dir=ltr]{unicode-bidi:isolate}

/* ---------- header ---------- */
/* OPAQUE, not .96. A sticky bar at 96% lets 4% of whatever scrolls beneath it through, and
   bright text on this dark ground is legible at 4% - it read as a smear of ghost letters
   across the bar on a real phone. There is no visual gain from the last 4%. */
.hdr{position:sticky;top:0;z-index:50;background:#0A1024;
 border-bottom:1px solid var(--fx-line);padding:10px var(--pad);display:flex;align-items:center;gap:10px}
.hbrand{display:flex;flex-direction:column;min-width:0;flex:1}
.hname{font-size:17px;font-weight:900;letter-spacing:.2px}
.hname b{color:var(--fx-gold)}
.hsub{font-size:10.5px;color:var(--fx-ink-mute)}
.hbtn{width:38px;height:38px;border-radius:11px;background:var(--fx-surface-2);border:1px solid var(--fx-line);
 display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:0 0 auto}
/* was gold-on-navy at 12.4:1 - the brightest thing on the screen was a debug label */
.demoTag{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--fx-ink-mute);
 background:transparent;border:1px solid var(--fx-line-2);padding:2px 6px;border-radius:5px;flex:0 0 auto}

/* ---------- shell ---------- */
.wrap{padding:var(--pad);max-width:560px;margin:0 auto}
.seg{display:flex;gap:6px;background:var(--fx-surface);border:1px solid var(--fx-line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:800;color:var(--fx-ink-dim)}
.seg button.on{background:var(--fx-surface-3);color:var(--fx-ink);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.card{background:var(--fx-surface);border:1px solid var(--fx-line-2);border-radius:var(--r);padding:var(--pad);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:900;color:var(--fx-ink)}
.muted{color:var(--fx-ink-mute);font-size:12px}
.dim{color:var(--fx-ink-dim)}

/* ---------- the kit tile: club identity WITHOUT any crest ----------
   Club trademarks are not licensed by any football data feed, so colours + pattern
   ARE the identity. Nine patterns, pure CSS, percentage-based so one rule works at
   every size. `sash` deliberately never mirrors in RTL. */
.fxkit{position:relative;border-radius:12px;flex:0 0 auto;overflow:hidden;display:flex;
 align-items:center;justify-content:center;background:var(--c1)}
/* SOLID kits must still use --c2, or 61 clubs discard it and the 12 white ones
   (Real Madrid, Leeds, Spurs, Sevilla, Fulham, Valencia...) render as identical blank
   rectangles. A collar and cuffs is what a real plain kit actually has. */
.fxkit[data-pat="solid"]{background:
 linear-gradient(180deg, var(--c2) 0 12%, transparent 12%),
 linear-gradient(90deg, var(--c2) 0 10%, transparent 10% 90%, var(--c2) 90%),
 var(--c1)}
.fxkit[data-pat="stripes"]{background:repeating-linear-gradient(90deg,var(--c1) 0 14.285%,var(--c2) 14.285% 28.571%)}
.fxkit[data-pat="hoops"]{background:repeating-linear-gradient(180deg,var(--c1) 0 20%,var(--c2) 20% 40%)}
.fxkit[data-pat="halves"]{background:linear-gradient(90deg,var(--c1) 0 50%,var(--c2) 50%)}
.fxkit[data-pat="sash"]{background:linear-gradient(58deg,var(--c1) 0 38%,var(--c2) 38% 62%,var(--c1) 62%)}
.fxkit[data-pat="band"]{background:linear-gradient(180deg,var(--c1) 0 62%,var(--c2) 62%)}
.fxkit[data-pat="diagonal"]{background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50%)}
.fxkit[data-pat="chevron"]{background:linear-gradient(45deg,var(--c2) 0 24%,transparent 24%),linear-gradient(-45deg,var(--c2) 0 24%,transparent 24%),var(--c1)}
.fxkit[data-pat="sleeves"]{background:linear-gradient(90deg,var(--c2) 0 16%,var(--c1) 16% 84%,var(--c2) 84%)}
[dir=rtl] .fxkit[data-pat="sash"]{background:linear-gradient(58deg,var(--c1) 0 38%,var(--c2) 38% 62%,var(--c1) 62%)}
/* three rim tiers, chosen by tile luminance at BUILD time, never at runtime */
.fxkit[data-rim="contain"]{border:2px solid rgba(6,10,26,.62);box-shadow:0 2px 8px rgba(0,0,0,.55)}
.fxkit[data-rim="standard"]{border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.fxkit[data-rim="rescue"]{border:2px solid rgba(255,255,255,.86);box-shadow:0 0 0 3px rgba(255,255,255,.10),0 2px 6px rgba(0,0,0,.45)}
/* isoluminant kits (Barcelona) get a hairline seam or the stripes fuse into one field */
.fxkit[data-iso="1"][data-pat="stripes"]{background:repeating-linear-gradient(90deg,
 var(--c1) 0 13.6%, rgba(0,0,0,.55) 13.6% 14.285%, var(--c2) 14.285% 27.9%, rgba(0,0,0,.55) 27.9% 28.571%)}
.fxkit::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(120% 80% at 30% 12%,rgba(255,255,255,.22),rgba(255,255,255,0) 60%)}
.fxcode{position:relative;z-index:2;font-size:11px;font-weight:900;letter-spacing:.5px;
 color:var(--ink);paint-order:stroke fill;-webkit-text-stroke:.6px rgba(0,0,0,.55)}
.k34{width:34px;height:34px}.k34 .fxcode{font-size:9px}
.k44{width:44px;height:44px}.k44 .fxcode{font-size:10px}
.k60{width:60px;height:60px}.k60 .fxcode{font-size:12.5px}

/* ---------- budget meter ---------- */
.bud{background:var(--fx-surface-2);border:1px solid var(--fx-line);border-radius:12px;padding:11px 12px;margin-bottom:12px}
.budtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.budleft{font-size:20px;font-weight:900;color:var(--fx-gold)}
.budlab{font-size:11px;color:var(--fx-ink-dim)}
.budtrack{height:9px;border-radius:99px;background:#0B1024;border:1px solid var(--fx-line);overflow:hidden;position:relative}
.budfill{height:100%;background:linear-gradient(90deg,var(--fx-acc),var(--fx-gold));transition:inline-size .25s}
/* the reserve floor: the money you MUST keep to fill remaining slots. Hatched, not a number to work out. */
.budresv{position:absolute;inset-block:0;inset-inline-end:0;background:repeating-linear-gradient(45deg,
 rgba(85,104,159,.55) 0 4px,rgba(85,104,159,.18) 4px 8px);border-inline-start:1px solid var(--fx-line-3)}
.budnext{font-size:11.5px;color:var(--fx-ink-dim);margin-top:7px;display:flex;justify-content:space-between;gap:8px}
.budnext b{color:var(--fx-ink)}

/* ---------- club rows ---------- */
.clubrow{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;
 background:var(--fx-surface-2);border:1px solid var(--fx-line);margin-bottom:7px;width:100%;text-align:start}
.clubrow.on{background:var(--fx-surface-3);border-color:var(--fx-line-3)}
/* Dim the row, never the reason. The blocked row used opacity:.42 on the whole element,
   which dragged its explanation down to 1.92:1 - the usability study timed a tester quitting
   at that exact moment, unable to see why Liverpool would not respond to a tap. */
.clubrow[disabled]{cursor:not-allowed}
.clubrow[disabled] .fxkit{opacity:.42}          /* only the kit dims - it carries no words */
.clubrow[disabled] .crn{color:var(--fx-ink-dim)}    /* 7.80:1 */
.clubrow[disabled] .crprice{color:var(--fx-ink-mute)} /* 4.56:1 */
.clubrow[disabled] .crpick{color:var(--fx-ink-dim);background:transparent}
.clubrow[disabled] .crwhy{opacity:1}
.crname{flex:1;min-width:0}
.crn{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crl{font-size:10.5px;color:var(--fx-ink-mute)}
.crwhy{font-size:10.5px;color:var(--fx-neg)}
.crprice{font-size:13px;font-weight:900;color:var(--fx-gold);flex:0 0 auto}
.crpick{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--fx-acc);color:#0B1020;
 font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
.clubrow.on .crpick{background:var(--fx-pos)}

/* ---------- pitch ---------- */
/* ============================================================================
   THE STADIUM
   A raked turf plane with the cards standing flat and upright on top of it.
   ONE transform does the perspective: rotateX on the turf only. The cards never
   rotate — a tilted card is unreadable and stops looking like an object you own.
   Everything is CSS. No images anywhere in this file.
   ============================================================================ */
:root{
 /* turf-b darkened #0C5430 -> #0A4A2A: the mow stripes were 1.147 apart, which is invisible.
    1.317 now, and club names still measure 7.23:1 on it. */
 --fx-turf-a:#0E5E33; --fx-turf-b:#0A4A2A;
 --st-rake:20deg;
 /* THE CARD IS SIZED FROM THE VIEWPORT, NOT CLAMPED.
    The pitch goes full-bleed (see .st) so all 100vw is available: four cards plus three 12px
    gaps plus 10px of touchline each side. 360 -> 76px, 375 -> 79.75, 390 -> 83.5.
    --depth is GONE. The old 90%-100% ramp bought a depth cue invisible at 47px and cost 5px
    of width on the back row, where four of the eleven cards live. Depth is carried by the
    raked turf, the row spacing and the plinth blur ramp, all of which are free. */
 --cw:calc((100vw - 56px) / 4);
 --ch:calc(var(--cw) * 1.32);
 --cw-sub:calc(var(--cw) * .76);
 --row-gap:6px;
}
/* ---- THE SECOND ACT ----
   A stadium that is identical on open #40 and open #1 is a screenshot, not a product.
   Four things drift across a season. Nothing is random, nothing is announced, and none of
   it confers any advantage — it is only ever a reflection of what you already did.
     · the SKY moves dusk -> night -> December Nights -> golden hour at the run-in
     · the CROWD fills as your group fills (one number, driven by friends joined)
     · the TURF wears: the centre circle's trodden ring grows, a goalmouth scuff appears
     · the PERIMETER goes gold while you are alive in the cup                          */
/* FULL BLEED. Measured at 360x640, the old layout put 478px of chrome above the pitch and
   250px of stacked buttons below it, leaving 19px of a 499px pitch on screen — 3.9%. On the
   width most of the audience actually owns, the stadium was never seen. This is the single
   change that fixes it: ignoring .wrap's padding reclaims 48px, which is the entire budget
   for growing the card from 47px to 76px. */
/* THE GROUND. A theme here is not a skin you pick — it is the state of your stadium, and you
   never choose it. It is scoped to the turf, the stands and the light because those are the
   only surfaces in the product where a club kit is never composited: every kit sits on the
   card, the club row or the share tile, all of which have fixed grounds. So the ground can
   change freely without invalidating a single one of the 126 hand-tuned rim decisions.
   The chrome — nav, cards, budget, points, sheets — never changes for anybody. */
.st{position:relative;border-radius:0;overflow:hidden;isolation:isolate;
 margin-inline:calc(50% - 50vw);inline-size:100vw;border-inline:none;
 border-block:1px solid var(--fx-line-2);
 --st-stand-1:#141C3E; --st-stand-2:#0C1330;
 --st-lamp-1:#E8F0FF;  --st-lamp-2:#9DB2DA;
 --st-glow:rgba(200,222,255,.55);
 --st-pool:rgba(190,214,255,.16);
 --st-line:.30;
 --st-mow:8.3333%;
 --crowd-a:.34; --wear:.055; --scuff:0;
 background:radial-gradient(120% 80% at 50% -10%, var(--sky-1,#14204A) 0%, var(--sky-2,#0A1130) 46%, #070B1A 100%)}
.st[data-sky="dusk"]    {--sky-1:#2A2560;--sky-2:#141A44}
.st[data-sky="night"]   {--sky-1:#14204A;--sky-2:#0A1130}
.st[data-sky="december"]{--sky-1:#0E1838;--sky-2:#070C24}
.st[data-sky="golden"]  {--sky-1:#3A2E58;--sky-2:#161B42}
/* alive in the cup: a gold hairline round the whole ground */
.st[data-cup="1"]{border-color:rgba(255,210,74,.50);box-shadow:0 0 0 1px rgba(255,210,74,.28) inset}
/* --- the four floodlight pools, painted on the sky --- */
.st__sky{position:absolute;inset:0;z-index:1;
 background:
  radial-gradient(50% 34% at 16% 8%, var(--st-pool), transparent 70%),
  radial-gradient(50% 34% at 84% 8%, var(--st-pool), transparent 70%)}
/* --- two pylons, not four: at this crop only the far pair is in frame --- */
.st__pylon{position:absolute;top:2%;width:26px;height:16%;z-index:2}
.st__pylon.a{inset-inline-start:9%} .st__pylon.b{inset-inline-end:9%}
.st__pylon i{position:absolute;inset-inline:0;top:0;height:9px;border-radius:2px;
 background:linear-gradient(180deg,var(--st-lamp-1),var(--st-lamp-2));
 box-shadow:0 0 12px 3px var(--st-glow)}
.st__pylon u{position:absolute;inset-inline-start:50%;top:9px;bottom:0;width:2px;margin-inline-start:-1px;
 background:linear-gradient(180deg,#3D4C82,#1A2244)}
/* --- the stands: three crowd grids at different scales so it never visibly repeats --- */
/* the crowd density IS your group: --crowd-a = .34 + .072 x friends joined.
   The social loop made visible in the object you look at every day, for one number. */
.st__stand{position:absolute;inset-inline:-2%;top:9%;height:15%;z-index:2;opacity:.85;
 background:
  radial-gradient(circle at 25% 30%, rgba(255,255,255,calc(var(--crowd-a) * .38)) 0 1px, transparent 1.6px) 0 0/7px 6px,
  radial-gradient(circle at 70% 65%, rgba(255,255,255,calc(var(--crowd-a) * .30)) 0 1px, transparent 1.6px) 3px 2px/11px 9px,
  radial-gradient(circle at 45% 50%, rgba(120,150,220,calc(var(--crowd-a) * .41)) 0 1px, transparent 1.6px) 1px 4px/5px 8px,
  linear-gradient(180deg,var(--st-stand-1),var(--st-stand-2));
 border-bottom:1px solid rgba(255,255,255,.10)}
/* --- the playing surface --- */
.st__stage{position:absolute;inset:0;z-index:3;perspective:820px;perspective-origin:50% 118%}
.st__turf{position:absolute;inset-inline:-3%;top:12%;bottom:0;transform-origin:50% 100%;
 transform:rotateX(var(--st-rake));
 background:
  radial-gradient(ellipse 26% 9% at 50% 2%, rgba(255,255,255,calc(var(--scuff) * .07)) 0 60%, transparent 72%),
  radial-gradient(circle at 50% 47%, rgba(255,255,255,var(--wear)) 0 16.5%, transparent 17.4%),
  repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px),
  repeating-linear-gradient(90deg, rgba(0,0,0,.030) 0 1px, transparent 1px 3px),
  repeating-linear-gradient(90deg, var(--fx-turf-a) 0 var(--st-mow),
                            var(--fx-turf-b) var(--st-mow) calc(var(--st-mow) * 2)),
  var(--fx-turf-b);
 box-shadow:inset 0 34px 56px -26px rgba(0,0,0,.62), inset 0 -44px 64px -34px rgba(0,0,0,.50)}
/* markings ride the same plane so they warp with it */
.st__mark{position:absolute;inset:0;pointer-events:none;
 background:
  radial-gradient(circle at 50% 47%, transparent 0 16.2%, rgba(255,255,255,var(--st-line)) 16.2% 16.8%, transparent 17.2%),
  linear-gradient(180deg, transparent calc(47% - 1px), rgba(255,255,255,calc(var(--st-line) * .87)) calc(47% - 1px) calc(47% + 1px), transparent calc(47% + 1px))}
/* ── THE EARNED GROUND ────────────────────────────────────────────────────────
   Not a chooser. A chooser carries no information about the person showing it,
   which is why Sorare's best-looking cards arrived alongside its worst revenue
   years. This one says you did the one thing the game actually needs: you set a
   legal eleven before the deadline, ten times. Tighter mow, fresher paint. */
.st[data-ground="clean"]{--fx-turf-a:#0F6335;--fx-turf-b:#0A4728;--st-line:.46;--st-mow:6.25%}
/* the ground's name, SOLID not alpha — an rgba() label on this turf measured 3.83:1 when it
   was claimed at 6.8:1, and every contrast failure found in three QA passes here came from an
   alpha multiplier rather than a hue. */
.st__brand{position:absolute;z-index:7;inset-block-end:6px;inset-inline-start:10px;
 font-size:9.5px;font-weight:800;letter-spacing:.3px;color:#C9D6F5;
 text-shadow:0 1px 3px rgba(0,0,0,.95)}
.st__box{position:absolute;inset-inline:26%;top:0;height:15%;border:2px solid rgba(255,255,255,.24);
 border-top:none;pointer-events:none}
/* --- the card layer: flat, upright, never rotated --- */
/* A VERTICAL STACK OF ROWS, not eleven absolutely-positioned percentages.
   The old approach authored slot tops against a FLAT turf and then rotated the turf, which
   moved the grass out from under them — it put the goalkeeper over the stands and had to be
   re-measured twice. A flex column cannot drift: the rows sit on the grass because they are
   laid out inside it. It also deletes the translate(-50%) RTL trap, since nothing is
   centred by a physical transform any more. */
/* IN FLOW, not absolute. The pitch used to take its height from aspect-ratio:10/16; with the
   rows absolutely positioned there was nothing left to give .st a height and it collapsed to
   2px — the whole stadium gone. The card stack now DEFINES the pitch's height and the sky,
   stands and turf are painted behind it. */
.st__cards{position:relative;z-index:6;display:flex;flex-direction:column;
 gap:var(--row-gap);padding-block:22px 10px;justify-content:flex-start}
.st__row{display:flex;justify-content:center;gap:12px}
/* ~18px of open turf down the spine, so a back four reads as a back four and not a table */
.st__row[data-n="4"] > :nth-child(2){margin-inline-end:18px}
/* five across does not fit 360 (416px needed): the midfield fans, leaning the same way in
   both directions so RTL never mirrors it */
.st__row[data-n="5"]{gap:0}
.st__row[data-n="5"] > *{margin-inline-end:-9px}
.st__row[data-n="5"] > :last-child{margin-inline-end:0}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;inline-size:var(--cw)}
/* ============================================================================
   THE CLUB CARD — the kit becomes a JERSEY on a card, not a coloured square.
   The 3-letter code moves off the kit onto a plate, which takes it from a
   per-club outline hack to a flat 18.1:1 for all 126 clubs.
   The rim metal encodes the price band, so value reads at a glance.
   ============================================================================ */
.cc{position:relative;inline-size:100%;block-size:var(--ch);border-radius:9px 9px 12px 12px;
 overflow:hidden;border:var(--band-w,1.5px) solid transparent;
 background:linear-gradient(var(--band-ground,#0B1024),var(--band-ground,#0B1024)) padding-box,
            var(--band,#3D4C82) border-box;
 box-shadow:var(--band-elev,0 4px 10px -4px rgba(0,0,0,.75));
 display:flex;flex-direction:column;padding:0;contain:paint;
 transition:opacity 260ms var(--e-out), filter 260ms var(--e-out), transform 180ms var(--e-pop)}
.cc:active{transform:scale(.965)}          /* there was no press state anywhere in the build */
/* The bands escalate on FOUR properties, not just hue — rim weight, gloss, elevation and
   ground. Sorare's own designers put it best: scarcity is expressed as DEPTH, with common
   cards "clean and simple and more or less flat" and the rarest ones darker "so we can
   better highlight the contrast between light and dark". Hue alone is the weak half of the
   idea; a budget card here is deliberately flat, an elite card is an object. */
/* The metals are real gradients, not five flat colours — a flat fill is a coloured line, a
   gradient is an edge that catches light and reads as an object. */
.cc[data-band="elite"] {--band:linear-gradient(160deg,#FFE39A,#FFC53D 42%,#B8801A);
 --band-w:2px;--band-ground:#080C1C;
 --band-elev:0 5px 12px -2px rgba(0,0,0,.68), 0 14px 28px -12px rgba(0,0,0,.62)}
.cc[data-band="strong"]{--band:linear-gradient(160deg,#F0D9A8,#D2A85C 44%,#8A6320);
 --band-w:1.75px;--band-ground:#0A0F20;
 --band-elev:0 4px 11px -2px rgba(0,0,0,.65), 0 12px 25px -11px rgba(0,0,0,.58)}
.cc[data-band="mid"]   {--band:linear-gradient(160deg,#EFF3FF,#C6D0EE 44%,#7C8AB8);
 --band-w:1.5px;--band-ground:#0B1024;
 --band-elev:0 4px 10px -2px rgba(0,0,0,.62), 0 10px 22px -10px rgba(0,0,0,.55)}
.cc[data-band="value"] {--band:linear-gradient(160deg,#F0C79A,#C08A52 44%,#7A4E24);
 --band-w:1.25px;--band-ground:#0B1024;
 --band-elev:0 3px 8px -2px rgba(0,0,0,.58), 0 8px 18px -9px rgba(0,0,0,.48)}
.cc[data-band="budget"]{--band:linear-gradient(160deg,#7C8AB8,#55689F 44%,#2A3560);
 --band-w:1px;--band-ground:#0C1128;--band-elev:0 2px 6px -2px rgba(0,0,0,.52)}

/* ============================================================================
   THE CARD *IS* THE KIT.
   Before this, the club — the only reason any of this exists — occupied 31.4% of
   its own card and the other 68.6% was #0B1024, the same navy on all eleven. That
   is why eleven cards read as eleven identical dark rectangles: their dominant
   surface WAS identical. The kit now fills the card above the plate, taking the
   kit area from 925px² to 5,016px² — 5.4x.
   ============================================================================ */
.cc__kit{position:absolute;inset-block-start:0;inset-inline:0;block-size:calc(var(--ch) - 34px);
 background:var(--c1)}
/* The scrim is FIXED and kit-independent: it is what lets text sit over 126 unknown colour
   combinations and still meet contrast. Without it, white type on Real Madrid's white kit. */
.cc__kit::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:
  radial-gradient(120% 80% at 30% 12%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%),
  linear-gradient(180deg, transparent 0 58%, rgba(4,7,18,.72) 82%, rgba(4,7,18,.94) 100%)}
/* the league mark: a 3px rail up the card's leading edge. See --lg-* for why it exists. */
.cc__lg{position:absolute;inset-block-start:0;inset-inline-start:0;z-index:2;
 inline-size:3px;block-size:calc(var(--ch) - 34px);background:var(--lgc,transparent);
 box-shadow:0 0 0 .5px rgba(4,7,18,.55)}
/* THE PLATE CARRIES ONE THING, NOT TWO.
   It used to hold the price AND the code at a fixed 11px on a card that renders 45px wide
   (the goalkeeper, at .90 depth) and 39px on the bench. Measured on the live page at 360px:
   the pair needs 4.00em, so at 11px it wants 52px of a 41px plate. It overflowed — and in
   RTL the overflow edge is the LEFT one, which is exactly where the price sits, so Real
   Madrid rendered as ".5RMA" and every 4.5M club as ".5". Reported from a real phone.

   Scaling the type down does not rescue it: to fit both, the goalkeeper's plate needs
   8.2px and the 48px floor needs 7.7px. That is not a readable size, it is a smaller bug.

   So the PRICE comes off the card. It is not lost and it is not even the card's job —
   the rim metal already encodes the price band, which is what "is this club expensive"
   actually asks, and the exact number is on the selection row, in the club sheet and in
   the budget line. What is left is the code, centred, at a full 11px.
   Keeping the code and showing the score beside it does not work either, and the numbers
   say so: measured on the live page, a code plus a score is 3.99em, so the plate needs
   8.6px on a 47px card and 7.6px on the goalkeeper at the 48px floor. Scanning all 36
   rounds this way clipped the code on 73 of 540 cards.

   At 47px the plate could hold exactly one thing. At 76px it holds TWO LINES, and the second
   one is the whole point: the FIXTURE. The price was the one field on the card frozen for the
   entire season, which is precisely why eleven cards looked the same on every open. Who you
   play changes every round; whether you are winning changes every few minutes.
       line 1   ARS               (H)      code + venue
       line 2   > TOT   /   1-0   /   +8   opponent, then live score, then points
   The price is not lost: it is in the shop, in the club sheet and in the budget line, and
   the rim metal carries the band. It was never the card's job. */
.cc__plate{margin-block-start:auto;block-size:34px;padding-inline:6px;
 display:grid;grid-template-rows:17px 17px;align-content:center;overflow:hidden;
 background:linear-gradient(180deg, rgba(11,16,36,.55), rgba(6,9,22,.94));
 border-block-start:1px solid rgba(255,255,255,.09);
 border-block-end:3px solid var(--tier,var(--fx-line-2))}
.cc__l1,.cc__l2{display:flex;align-items:center;justify-content:space-between;gap:4px;min-inline-size:0}
.cc__code{font:900 13px/1 system-ui;letter-spacing:.4px;direction:ltr;color:var(--fx-ink);
 white-space:nowrap}
.cc__ven{font:800 10px/1 system-ui;direction:ltr;color:var(--fx-ink-mute);white-space:nowrap;
 font-variant-numeric:tabular-nums}
.cc__fx{font:800 11px/1 system-ui;color:var(--fx-ink-dim);font-variant-numeric:tabular-nums;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-inline-size:0}
/* opponent strength on the bottom rail. --t1..--t5 shipped in :root and were referenced
   nowhere at all — five dead tokens that are exactly what this line needs. */
.cc[data-tier="1"]{--tier:var(--t1)}
.cc[data-tier="2"]{--tier:var(--t2)}
.cc[data-tier="3"]{--tier:var(--t3)}
.cc[data-tier="4"]{--tier:var(--t4)}
.cc[data-tier="5"]{--tier:var(--t5)}
.cc[data-st="live"]{border-color:var(--fx-live);--band:var(--fx-live);--band-w:2px}
.cc[data-st="live"] .cc__ven,.cc[data-st="live"] .cc__fx{color:var(--fx-live)}
.cc[data-st="live"] .cc__plate{border-block-end-color:var(--fx-live)}
/* colour by SIGN only, never by magnitude, and a zero is always printed and never coloured */
.cc__fx[data-sign="pos"]{color:var(--fx-pos)}
.cc__fx[data-sign="neg"]{color:var(--fx-neg)}
.cc__fx[data-sign="nil"]{color:var(--fx-ink-mute)}
/* a blank is a state of one CARD, not of the screen. At 76px the words finally fit, so the
   label comes back out of aria-label where it had to hide at 47px. */
.cc--blank{filter:saturate(.45) brightness(.82)}
.cc--blank .cc__plate{border-block-end-color:var(--fx-blank)}
.cc--blank .cc__fx{color:var(--fx-ink-dim)}   /* 8.83:1 — the blank hue alone is 3.16 and fails */
/* THE DIFFERENTIAL RULE — the entire head-to-head idea, in two properties. A club you and
   your rival both own cannot change the gap between you, so it recedes. */
.st[data-h2h="on"] .slot[data-shared="1"] .cc,
.st[data-h2h="on"] .subslot[data-shared="1"] .cc{opacity:.52;filter:saturate(.55)}
/* the armband as an actual armband, not 8.5px of text. Must NOT mirror: a captain's armband
   is worn on the left arm in every league on earth. */
.cc__arm{position:absolute;inset-block-start:24%;inset-inline-start:5%;z-index:4;
 inline-size:calc(var(--cw) * .20);block-size:calc(var(--cw) * .13);border-radius:2px;
 background:linear-gradient(180deg,#FFE39A,#FFC53D 46%,#C98F14);
 box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 1px 3px rgba(0,0,0,.6);font-size:0}
.cc__arm::before{content:"";position:absolute;inset-inline:14%;top:38%;block-size:22%;
 background:rgba(11,16,32,.72);border-radius:1px}
[dir=rtl] .cc__arm{inset-inline-start:auto;inset-inline-end:5%}
 /* The name scales with the viewport and may take TWO lines. Fixed 10px with nowrap+ellipsis
    turned a long Arabic club name into an ellipsis on a small phone, which is the same as no
    name at all. */
/* THE NAME MOVES ONTO THE CARD. Below the card it cost 24px of height per row — 96px of the
   pitch — which is height the stadium cannot spare at 360x640. It now sits on the kit's own
   bottom scrim, which is a fixed rgba(4,7,18,.94) and therefore contrast-safe over all 126
   kits, and costs zero layout height. The owner's complaint was that names were not CLEAR,
   not that they were missing, so removing them was never the answer. */
.cc__nm{position:absolute;inset-inline:3px;inset-block-end:36px;z-index:3;
 font-size:9.5px;font-weight:800;line-height:1;color:#F2F5FF;text-align:center;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 text-shadow:0 1px 3px rgba(0,0,0,.95)}
/* THE PLINTH. It was written, then killed with display:none — and it is item one on the
   spectacle spec's own list ("if you build one thing from C.4, build the plinth"). It is
   what makes a card look like it is STANDING on the grass rather than floating over it.
   The blur deepens row by row, which is the depth cue the --depth ramp was failing to buy. */
.slot .plinth{display:block;inline-size:calc(var(--cw) * .70);block-size:7px;
 margin-block-start:-3px;filter:blur(var(--plinth-blur,1.5px));
 background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.62), transparent 72%)}
.st__row:nth-child(1) .plinth{--plinth-blur:1px}
.st__row:nth-child(2) .plinth{--plinth-blur:1.4px}
.st__row:nth-child(3) .plinth{--plinth-blur:1.8px}
.st__row:nth-child(4) .plinth{--plinth-blur:2.2px}
/* An empty slot is a shirt waiting on a peg, and it carries the ONE number that turns
   "pick another club" into a decision: the most you can still afford. Specified in the
   spectacle doc and never built. The breathe stops the moment the XI is complete. */
.cc--empty{border:1.5px dashed var(--fx-line-3);background:rgba(255,255,255,.045);
 box-shadow:none;color:var(--fx-ink-mute);align-items:center;justify-content:center}
.cc--empty .cc__num{position:absolute;inset-block-start:26%;inset-inline:0;text-align:center;
 font:900 15px/1 system-ui;color:var(--fx-ink-mute);font-variant-numeric:tabular-nums}
.cc--empty .cc__hook{position:absolute;inset-block-end:8px;inset-inline:0;text-align:center;
 font:900 13px/1 system-ui;color:var(--fx-gold);font-variant-numeric:tabular-nums;direction:ltr}
.st:not([data-full="1"]) .cc--empty{animation:ccBreathe 2600ms ease-in-out infinite}
@keyframes ccBreathe{0%,100%{opacity:.72}50%{opacity:1}}

/* ---------- the dugout ---------- */
.dug{margin-top:10px;background:linear-gradient(180deg,#0E1430,#0A1026);border:1px solid var(--fx-line-2);
 border-radius:var(--r);padding:10px 10px 12px}
.dug__lab{font-size:10.5px;color:var(--fx-ink-mute);margin-bottom:8px;text-align:center}
.dug__row{display:flex;gap:8px;justify-content:space-between}
.subslot{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
/* A substitute must be subordinate to a starter but still tappable. The bench used to render
   39.3px wide — 18% under the 48px tap floor — while an earlier version had it at 2.4x the
   AREA of the eleven clubs that actually play. At .76 it is 58% of a starter's area and
   passes 48px. */
.subslot .cc{inline-size:var(--cw-sub);block-size:calc(var(--cw-sub) * 1.32);
 filter:saturate(.86) brightness(.90)}
.subslot.on .cc{filter:none}
.subslot .ord{position:absolute;inset-block-start:-4px;inset-inline-start:-3px;z-index:5;width:16px;height:16px;
 border-radius:50%;background:var(--fx-surface-3);border:1px solid var(--fx-line-3);color:var(--fx-ink-dim);
 font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center}

/* ============================================================================
   THE SWAP — SUBTRACTIVE, NOT ADDITIVE.
   Arming a card used to paint a gold "بدّل" badge on all fifteen at once: 6,286px²
   of gold in a single tap, on a screen whose own colour spec assigns gold to VALUE
   and --fx-acc to INTERACTIVE. Now the armed card lifts and everything else steps
   back, which is how selection works everywhere else in the world. A sticky bar
   names the club and offers the only escape, which also deletes the bug where the
   armed state leaked through ten different code paths into an accidental swap.
   ============================================================================ */
.slot.armed .cc, .subslot.armed .cc{outline:3px solid var(--fx-acc);outline-offset:2px;
 transform:translateY(-4px) scale(1.04);filter:none;z-index:8}
.st[data-arm="1"] .slot:not(.armed) .cc,
.dug[data-arm="1"] .subslot:not(.armed) .cc{filter:brightness(.55) saturate(.7)}
.swapbar{position:sticky;inset-block-end:calc(62px + env(safe-area-inset-bottom));z-index:70;
 display:flex;align-items:center;gap:10px;min-block-size:44px;margin-block-start:8px;
 padding:8px 12px;border-radius:var(--r);background:var(--fx-surface-3);
 border:1px solid var(--fx-acc);box-shadow:0 -6px 18px -8px rgba(0,0,0,.7)}
.swapbar b{flex:1;font-size:12.5px;font-weight:800;color:var(--fx-ink)}
.swapbar button{flex:0 0 auto;min-block-size:32px;padding:0 12px;border-radius:8px;
 background:var(--fx-surface-2);color:var(--fx-ink-dim);font-size:12px;font-weight:800}
/* the bench card is 58px, so its name needs a size of its own */
.subslot .cc__nm{font-size:8.5px;inset-block-end:33px}
/* a sub that actually came on: the fourth official's board, lit */
.subslot.on .cc{border-color:var(--fx-pos)}
.subslot.on .camein{font-size:8.5px;font-weight:900;color:#08210F;background:var(--fx-pos);
 padding:1px 5px;border-radius:4px;text-shadow:none}

/* ============================================================================
   THE GAP BAND — «إنت بتلعب ضد حد» / you are playing somebody.
   The one thing this screen was missing: an opponent. Without it the screen shows
   a number with nothing to compare it to, which is why it produced nothing on the
   fortieth open, or the first. Every card is then read against that rival: clubs
   you BOTH own cannot move the gap between you, so they recede.
   ============================================================================ */
.gapb{display:block;inline-size:100%;text-align:start;margin-block-end:6px;padding:4px 10px;
 border-radius:var(--r);background:var(--fx-surface-2);border:1px solid var(--fx-line-2)}
.gapb__who{display:flex;align-items:center;justify-content:space-between;gap:8px;
 font-size:12.5px;font-weight:800;margin-block-end:2px}
.gapb__me{color:var(--fx-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gapb__vs{color:var(--fx-ink-mute);font-size:11px;flex:0 0 auto}
.gapb__them{color:var(--fx-ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 text-align:end}
.gapb__nums{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gapb__n{font:900 28px/1 system-ui;font-variant-numeric:tabular-nums;direction:ltr}
.gapb__n.me{color:var(--fx-ink)}
.gapb__n.them{color:var(--fx-ink-dim)}
/* The gap always carries a GLYPH and a SIGN as well as a hue: deuteranopia collapses
   --fx-pos and --fx-neg to 1.32:1, so colour alone is unreadable for ~8% of men. */
.gapb__d{font:900 15px/1 system-ui;font-variant-numeric:tabular-nums;direction:ltr;flex:0 0 auto}
.gapb__d[data-s="pos"]{color:var(--fx-pos)}
.gapb__d[data-s="neg"]{color:var(--fx-neg)}
.gapb__d[data-s="nil"]{color:var(--fx-ink-mute)}
.gapb__part{font-size:11px;font-weight:800;color:var(--fx-ink-mute)}

/* ---------- tier dots ---------- */
.tier{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--fx-ink-dim)}
.tdot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- points ---------- */
.ptsbig{font-size:44px;font-weight:900;color:var(--fx-gold);line-height:1;text-align:center}
.ptsrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--fx-line);font-size:13px;gap:10px}
.ptsrow:last-child{border-bottom:none}
.ptsrow .v{font-weight:900}
.pos{color:var(--fx-pos)}.neg{color:var(--fx-neg)}

/* ---------- leaderboard ---------- */
.lbrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;background:var(--fx-surface-2);
 border:1px solid var(--fx-line);margin-bottom:6px}
.lbrank{width:26px;font-weight:900;color:var(--fx-ink-mute);font-size:12px}
.lbrow.me{border-color:var(--fx-gold);background:var(--fx-surface-3)}
.lbname{flex:1;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbpts{font-weight:900;color:var(--fx-gold)}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;inset-inline:0;bottom:0;z-index:60;display:flex;
 /* opaque for the same reason as .hdr - the tab labels had ghost text sitting behind them */
 background:linear-gradient(180deg,#0A1024,#080D1E);border-top:1px solid var(--fx-line-2);
 padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;
 color:var(--fx-ink-mute);font-size:10.5px;font-weight:700}
.bnav button.on{color:var(--fx-gold)}
.bnav .ic{font-size:19px;line-height:1}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:120;background:var(--fx-scrim);display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--fx-surface);border:1px solid var(--fx-line-2);border-start-start-radius:20px;border-start-end-radius:20px;
 width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px var(--pad) 26px;position:relative;overscroll-behavior:contain}
.sx{position:sticky;top:0;float:inline-end;width:32px;height:32px;border-radius:50%;background:var(--fx-surface-3);
 color:var(--fx-ink-dim);font-size:15px;z-index:40}
.sheetbox h2{margin:0 0 4px;font-size:18px;font-weight:900}

/* ---------- wizard ---------- */
.wizdots{display:flex;gap:6px;justify-content:center;margin:14px 0 18px}
.wizdot{width:7px;height:7px;border-radius:50%;background:var(--fx-line-2)}
.wizdot.on{background:var(--fx-gold);width:20px;border-radius:99px}
.wizart{font-size:52px;text-align:center;margin:8px 0 14px}
.wizh{font-size:20px;font-weight:900;text-align:center;margin-bottom:8px}
.wizp{font-size:14px;color:var(--fx-ink-dim);text-align:center;line-height:1.65;margin-bottom:6px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--fx-acc);color:#12060B;
 font-weight:900;font-size:15px;text-align:center;margin-top:14px}
.btn.ghost{background:transparent;border:1px solid var(--fx-line-2);color:var(--fx-ink-dim);font-weight:700;margin-top:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- coach mark ---------- */
.coach{position:fixed;z-index:130;background:var(--fx-surface-3);border:1px solid var(--fx-line-3);
 border-radius:12px;padding:11px 13px;max-width:290px;box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:12.5px;line-height:1.55}
.coach b{color:var(--fx-gold)}
.coach .cdo{margin-top:9px;text-align:end;color:var(--fx-acc);font-weight:900;font-size:12px}

/* ---------- glossary ---------- */
.gloss{border-bottom:1px solid var(--fx-line);padding:10px 0}
.gloss:last-child{border-bottom:none}
.gterm{font-size:13.5px;font-weight:900;color:var(--fx-gold)}
.gen{font-size:11px;color:var(--fx-ink-mute)}
.gdef{font-size:12.5px;color:var(--fx-ink-dim);margin-top:3px;line-height:1.6}

.note{background:rgba(255,197,61,.08);border:1px solid rgba(255,197,61,.32);border-radius:11px;
 padding:10px 12px;font-size:12px;color:var(--fx-ink-dim);margin-bottom:12px;line-height:1.6}
/* A thin range input is the wrong control on a phone: hard to hit, hard to read, and it
   gives no sense of where the season is. This is a scroll-snapping strip of rounds - flick
   it like any list, the current one is obvious, every target is 44px. */
.gwbar{background:var(--fx-surface-2);border:1px solid var(--fx-line);border-radius:12px;
 padding:9px 0 7px;margin-bottom:10px}
.gwbar__top{display:flex;justify-content:space-between;align-items:baseline;
 padding:0 12px 7px;font-size:11.5px;color:var(--fx-ink-dim);gap:8px}
.gwbar__top b{color:var(--fx-gold);font-size:15px}
.gwbar__strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;
 padding:0 12px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gwbar__strip::-webkit-scrollbar{display:none}
.gwchip{flex:0 0 auto;min-width:44px;height:44px;border-radius:11px;scroll-snap-align:center;
 background:var(--fx-surface-3);border:1px solid var(--fx-line);color:var(--fx-ink-dim);
 font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.gwchip.on{background:var(--fx-acc);border-color:var(--fx-acc);color:#12060B;font-weight:900}
.gwchip.done{color:var(--fx-ink-mute)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;padding:7px 12px;border-radius:99px;background:var(--fx-surface-2);border:1px solid var(--fx-line);
 font-size:12px;font-weight:700;color:var(--fx-ink-dim)}
.fchip.on{background:var(--fx-surface-3);color:var(--fx-ink);border-color:var(--fx-line-3)}

/* ============================================================================
   THE ENTRY SEQUENCE — the first three seconds.
   Floodlights strike, the crowd rises, then the XI WALKS OUT one at a time.
   It runs once per session and it stops. Nothing loops: a screen that never
   settles is a screen you cannot read.
   ============================================================================ */
@keyframes stLit{from{opacity:0}to{opacity:1}}
@keyframes stStrike{
 0%{opacity:0}
 22%{opacity:1}
 34%{opacity:.55}      /* the arc lamp stutters as it strikes — this is the whole trick */
 48%{opacity:1}
 100%{opacity:1}}
@keyframes stCrowd{from{opacity:0;transform:translateY(10px)}to{opacity:.85;transform:none}}
@keyframes stWalk{
 from{opacity:0;transform:translate(var(--tx),-50%) translateY(14px) scale(.94)}
 to{opacity:1;transform:translate(var(--tx),-50%)}}
@keyframes stCount{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.st__pylon i{animation:stStrike 620ms cubic-bezier(.22,1,.36,1) both}
.st__sky{animation:stLit 420ms linear both}
.st__stand{animation:stCrowd 520ms cubic-bezier(.22,1,.36,1) both 160ms}
.st__turf{animation:stLit 300ms linear both 120ms}

 wiz2p:["ميزانيتك 120 مليون: 11 نادي في الملعب و4 على الدكة. البدلاء بيدخلوا لوحدهم لو ناديك مالوش ماتش. و3 أندية بالكتير من الدوري الواحد، عشان تفضل تتفرج على كل حاجة.",

 wiz4p:["نادي واحد بس بياخد ضعف النقط. اختاره كويس.","One club scores double. Choose well."],
 autoPick:["املا الباقي لوحده","Auto-pick"],
 coachBudget:["الشريط ده فلوسك. الجزء المخطط محجوز للأماكن اللي لسه فاضية.","This bar is your money. The hatched part is reserved for your empty slots."],
 coachCap:["دوس على أي نادي عشان تخليه الكابتن.","Tap any club to make it your captain."],
 coachPts:["دوس على نقاط أي نادي عشان تشوف جت منين بالظبط.","Tap any club's points to see exactly how they were earned."],

   The modules' own tests verify there are zero key collisions between them. */
for(const bag of ["GW_STR", "CHIP_STR", "TUT_STR", "SHARE_STR", "LND_STR"]){
 try{ if(typeof window[bag] === "object" && window[bag]) Object.assign(STR, window[bag]); }catch(_){}
}
/* {name} placeholders are interpolated. Without this, a string written as "Swap {club} with
   who?" rendered the braces verbatim on screen — which is what it did until it was measured. */
function t(k, vars){
 const e = STR[k];
 let s = e ? e[LANG === "ar" ? 0 : 1] : k;
 if(vars) s = s.replace(/\{(\w+)\}/g, (m, key) => (key in vars ? String(vars[key]) : m));
 return s;
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const num = n => String(n);

function clubName(c){ return LANG === "ar" && c.ar ? c.ar : (c.short || c.name); }
function leagueName(id){ const l = LEAGUES.find(x => x.id === id); return l ? (LANG === "ar" ? l.ar : l.en) : id; }
/* 0, not 8: a default price hid a corrupted squad by making a phantom club look affordable */
function priceOf(id){ return id && PRICES[id] ? PRICES[id].price : 0; }
function tierOf(id){ return PRICES[id] ? PRICES[id].tier : "mid"; }

/* ---------------- kit tile: the whole club identity, no crest ---------------- */
function kitHtml(c, size){
 return '<span class="fxkit ' + (size || "k44") + '" data-pat="' + esc(c.pat) + '" data-rim="' + esc(c.rim) + '"'
  + (c.iso ? ' data-iso="1"' : "")
  + ' style="--c1:' + esc(c.c1) + ';--c2:' + esc(c.c2) + ';--ink:' + esc(c.ink) + '">'
  + '<span class="fxcode" dir="ltr">' + esc(c.code) + "</span></span>";
}

/* ---------------- budget maths ----------------
   The reserve floor is what makes overspending unreachable instead of punished:
   you can never spend money that the remaining slots still need. */
function spent(){ return squad.reduce((a, id) => a + priceOf(id), 0); }
function remaining(){ return +(BUDGET - spent()).toFixed(1); }
function slotsLeft(){ return SQUAD_SIZE - squad.length; }
function reserve(){ return Math.max(0, (slotsLeft() - 1)) * MIN_CLUB_PRICE; }
function maxNextPrice(){ return slotsLeft() <= 0 ? 0 : +(remaining() - reserve()).toFixed(1); }
function leagueCount(lg){ return squad.filter(id => (CLUBS.find(c => c.id === id) || {}).lg === lg).length; }

/* why a club cannot be picked — printed on the row, so there is no error state */
function blockReason(c){
 if(squad.includes(c.id)) return null;
 if(slotsLeft() <= 0) return t("squadFull");
 if(leagueCount(c.lg) >= MAX_PER_LEAGUE) return t("leagueFull");
 if(priceOf(c.id) > maxNextPrice()) return t("tooExpensive");
 return null;
}

function save(){
 try{
  localStorage.setItem("fx_squad", JSON.stringify(squad));
  localStorage.setItem("fx_cap", captain || "");
 }catch(_){}
}
let squadWasRepaired = false;
function load(){
 try{
  squad = JSON.parse(localStorage.getItem("fx_squad") || "[]");
  captain = localStorage.getItem("fx_cap") || null;
 }catch(_){ squad = []; captain = null; }
 if(!Array.isArray(squad)) squad = [];
 validateSquad();
}
/* A STORED squad can become illegal without the user touching anything: prices move, a club
   is relegated out of the pool, the rules change. Never trust what came out of storage —
   rebuild it into a legal state and say so, rather than rendering an over-budget team. */
function validateSquad(){
 const before = squad.length;
 squad = squad.filter(id => CLUBS.some(c => c.id === id));      /* club no longer in the pool */
 const kept = [], seenLg = {};
 for(const id of squad){
  const c = CLUBS.find(x => x.id === id);
  const lg = c.lg;
  if((seenLg[lg] || 0) >= MAX_PER_LEAGUE) continue;             /* league cap tightened */
  const cost = kept.reduce((a, k) => a + priceOf(k), 0) + priceOf(id);
  /* Keeping a club must not strand the user. The FIRST version of this only checked the
     budget, and produced a squad of 5 with 9.5M left for 3 slots that needed 12M — legal
     but impossible to finish. Apply the same reserve floor the picker enforces, so a
     repaired squad is always completable. */
  const needForRest = (SQUAD_SIZE - (kept.length + 1)) * MIN_CLUB_PRICE;
  if(cost + needForRest > BUDGET) continue;                      /* prices rose past the budget */
  seenLg[lg] = (seenLg[lg] || 0) + 1;
  kept.push(id);
 }
 if(kept.length !== before || squad.length !== before) squadWasRepaired = true;
 squad = kept;
 if(captain && !squad.includes(captain)) captain = null;
 save();
}

/* ---------------- simulated scoring (demo only) ----------------
   Deterministic from club id + gameweek so the same squad always shows the same
   story. Mirrors the real scoring shape: result + clean sheet + goals - conceded
   + opponent-strength tier bonus. */
function hash(str){ let h = 2166136261; for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); }
/* THE FROZEN CALENDAR. Each entry is [from, to, days, coverage%] for one of the 36 rounds.
   The fallback is the old flat 10/11 so the game still runs if the file fails to load. */
let CAL = null;
function gwRound(gw){ return CAL && CAL.gws[gw - 1] ? CAL.gws[gw - 1] : null; }
function gwCoverage(gw){ const r = gwRound(gw); return r ? r[3] / 100 : 10 / 11; }
function gwDates(gw){
 const r = gwRound(gw); if(!r) return "";
 const d = s => { const p = s.split("-"); return p[2] + "/" + p[1]; };
 return d(r[0]) + " – " + d(r[1]);
}
function simMatch(clubId, gw){
 /* No CLUBS.find() here. It used to look the club up and discard the result — a 126-item
    linear scan on every call, which at GW36 is ~340,000 wasted comparisons per leaderboard. */
 const h = hash(clubId + "|" + gw);
 /* Strength comes from the PRICE, via a per-club value calibrated at build time so the
    36-round total lands on the economist's xptsSeason — the very number the price was
    derived from. It used to come from a five-value tier STRING, which disagreed with price
    for 45 of 126 clubs (price carries a league-fame multiplier the tier does not), so
    Celtic at 13.5M scored less than Basaksehir at 6.5M and price -> points was r = 0.781.
    Recalibrated it is r = 0.967, and points per million no longer runs backwards.
    Regenerate with scripts/build-strength.mjs; never hand-edit `str`. */
 const strength = (PRICES[clubId] && PRICES[clubId].str) ||
   ({ elite:.62, strong:.52, mid:.42, value:.34, budget:.28 }[tierOf(clubId)] || .4);
 const roll = (h % 1000) / 1000;
 const win = roll < strength, draw = !win && roll < strength + .26;
 const gf = win ? 1 + (h >> 3) % 3 : draw ? (h >> 5) % 2 : (h >> 7) % 2;
 const ga = win ? (h >> 9) % 2 : draw ? gf : 1 + (h >> 11) % 2;
 const oppTier = 1 + (h >> 13) % 5;
 /* BLANKS COME FROM THE CALENDAR NOW, not from a constant 1-in-11. The frozen 36-round
    calendar carries a real fixture-coverage figure per round, and the hash-derived blank
    contradicted it flatly: clubs blanked in rounds with 100% coverage and played in the
    61.9% round. The badge was internally consistent with the score and externally a lie. */
 const blank = ((h >> 17) % 1000) / 1000 >= gwCoverage(gw);
 if(blank) return {blank:true, pts:0, opp:null, home:false, oppTier:oppTier};
 /* WHO you play, drawn from the same hash as everything else so it can never contradict the
    result. The card needs this: the price was the one field on it frozen for the whole
    season, which is exactly why eleven cards looked identical on every open. A real build
    replaces this function with the fixture list and nothing above it changes. */
 const opp = leagueMate(clubId, h);
 const home = ((h >> 21) & 1) === 1;
 const res = win ? 6 : draw ? 2 : 0;
 const clean = ga === 0 ? 4 : 0;
 const goals = gf * 1;
 const conc = -Math.floor(ga / 2);
 const tierBonus = win ? [0,3,2,1,0,0][oppTier] : 0;
 return {blank:false, win, draw, gf, ga, oppTier, res, clean, goals, conc, tierBonus,
         opp: opp, home: home,
         pts: res + clean + goals + conc + tierBonus};
}
/* Built once, on first use — a per-league index so picking an opponent is O(1) and not a
   126-club scan on every card, every round, every render. */
let _lgIdx = null;
function leagueMate(clubId, h){
 if(!_lgIdx){
  _lgIdx = {};
  for(const c of CLUBS) (_lgIdx[c.lg] || (_lgIdx[c.lg] = [])).push(c);
 }
 const me = CLUBS.find(x => x.id === clubId);
 if(!me) return null;
 const pool = _lgIdx[me.lg] || [];
 if(pool.length < 2) return null;
 /* never draw yourself: step past your own index rather than reject-and-retry */
 const mine = pool.indexOf(me);
 const k = (h >> 23) % (pool.length - 1);
 return pool[k >= mine ? k + 1 : k];
}
/* AUTOMATIC SUBSTITUTION.
   A club with no fixture scores nothing, and the scenario analysis measured that an XI with no
   bench forfeits 158 points a season — 4.2% — to blanks it cannot cover. So a blanked starter is
   replaced, in bench order, by the first substitute who actually has a match. Each sub can only
   come on once. This returns the whole picture, not just a number, because the points screen has
   to be able to SHOW what happened. */
/* Takes the squad and captain as ARGUMENTS so the rivals can be scored by exactly the same
   engine as the player. They used to be scored over all 15 of their clubs while the player
   scored 11 plus auto-subs — a permanent 20.7%-25.5% handicap that put an ordinary squad
   6th of 6 in 98.7% of measured seasons. A leaderboard nobody can climb is worse than none. */
function resolveSquad(sq, cap, gw){
 const starters = sq.slice(0, START_SIZE);
 const bench = sq.slice(START_SIZE);
 const used = {};
 const lineup = [];
 for(const id of starters){
  const m = simMatch(id, gw);
  if(!m.blank){ lineup.push({id: id, m: m, sub: null}); continue; }
  let replacement = null;
  for(const b of bench){
   if(used[b]) continue;
   const bm = simMatch(b, gw);
   if(bm.blank) continue;
   used[b] = 1; replacement = {id: b, m: bm};

 for(const row of lineup){
  const scorer = row.sub || row;
  /* THE ARMBAND FOLLOWS THE SHIRT. It used to be checked against the scorer, so when the
     captain had no fixture his substitute came on and the double paid nothing — measured
     at 935 of 10,800 rounds (8.66%), and it wasted a Triple Captain chip outright in 8.70%
     of plays. The captain's replacement now inherits the armband, which is what a manager
     would expect and what the vice-captain rule exists to do elsewhere. */
  const isCap = row.id === cap;
  total += scorer.m.pts * (isCap ? 2 : 1);

/* Derived from the same deterministic simulation the scoring uses, so the badge can never

    never reads, so "plays twice" clubs actually averaged 5.21 points against 5.55 for the

/* A MINUS SIGN IS U+2212, NOT A HYPHEN. A hyphen is narrower than a digit, so a column of

const MINUS = "−";

/* Rivals own REAL squads and are scored by the same engine as the user.

   rival to the user's own score: three offsets came out positive and two negative, so every
   player sat at exactly 4th of 6 forever, whatever they picked. A leaderboard that cannot move
   is not a leaderboard — and it was the first screen telling the owner the game was over. */
/* names, not transliterations - the leaderboard is the one screen where a user looks for
   someone they know, and Latin names in an Arabic-first product read as placeholder data */
const RIVALS = [["يحيى","Yahia"], ["حجازي","Hegazy"], ["عمر","Omar"], ["كريم","Kareem"], ["مصطفى","Mostafa"]];
const rivalName = r => r[LANG === "ar" ? 0 : 1];
function rivalSquad(name){
 const out = [], byLg = {};
 /* deterministic per rival, but a genuinely different team each — sample the pool by a seeded walk */
 let seed = hash(name);
 const pool = CLUBS.slice().sort((a, b) => priceOf(b.id) - priceOf(a.id));
 let budget = BUDGET;
 for(let guard = 0; guard < 800 && out.length < SQUAD_SIZE; guard++){
  seed = (seed * 1103515245 + 12345) >>> 0;
  /* Draw from the QUALITY end of the pool, not uniformly. A uniform draw over 126 clubs
     fields five weak squads, and once the scoring was calibrated to price that turned the
     board from unwinnable straight into unlosable — the recommended team won by 73 every
     time. The exponent was chosen by measurement, not feel: at 1.6 the leading rival lands
     within 7 points of a well-built squad over a full season, which is the whole point. */
  const r = (seed % 100000) / 100000;
  const c = pool[Math.min(pool.length - 1, Math.floor(pool.length * Math.pow(r, 1.6)))];
  if(out.includes(c.id)) continue;
  if((byLg[c.lg] || 0) >= MAX_PER_LEAGUE) continue;
  const need = (SQUAD_SIZE - out.length - 1) * MIN_CLUB_PRICE;
  if(priceOf(c.id) + need > budget) continue;
  out.push(c.id); byLg[c.lg] = (byLg[c.lg] || 0) + 1; budget -= priceOf(c.id);
 }
 return out;
}
function rivalTotal(name){
 const sq = rivalSquad(name);
 /* the captain must be a STARTER, exactly as the player's must be */
 const cap = sq[hash(name + "c") % Math.max(1, Math.min(START_SIZE, sq.length))];
 let total = 0;
 /* Same engine as the player: eleven starters, auto-subs for blanks, armband on one club.
    Summing all 15 here is what made the board unwinnable. */
 for(let g = 1; g <= CURRENT_GW; g++) total += resolveSquad(sq, cap, g).total;
 return total;
}
/* ============================================================================
   THE HEAD-TO-HEAD. Your nearest rival on the board — whoever is directly above you,
   or directly below if you lead. Everything on the team screen is then read against
   them, which is the difference between a score and a contest.
   ============================================================================ */
/* THE LEDGER. One number: the rounds in which you had a legal eleven at the deadline. It is
   not a streak — fantasy-engagement.md refuses streaks, and rightly: missing round 14 should
   cost you round 14 and nothing else. Ten rounds, in any order, earns the Groundsman's Pitch.
   In the demo the season is walked with the scrubber, so a round counts as you reach it. */
const GROUND_AT = 10;
function ledger(){
 try{ return JSON.parse(localStorage.getItem("fx_ledger") || "[]"); }catch(_){ return []; }
}
function markRound(gw){
 if(squad.length < SQUAD_SIZE) return;
 const L = ledger();
 if(L.indexOf(gw) >= 0) return;
 L.push(gw);
 try{ localStorage.setItem("fx_ledger", JSON.stringify(L)); }catch(_){}
}
function groundOf(){ return ledger().length >= GROUND_AT ? "clean" : "base"; }
let h2hIdx = 0;
function boardRows(){
 return RIVALS.map((r, i) => ({i: i, name: rivalName(r), s: rivalTotal(rivalName(r)), me: false}))
   .concat([{i: -1, name: teamName(), s: seasonTotal(), me: true}])
   .sort((a, b) => b.s - a.s);
}
function nearestRival(){
 const rows = boardRows();
 const at = rows.findIndex(r => r.me);
 if(at < 0 || rows.length < 2) return null;
 /* the one above you; if you lead, the one breathing down your neck */
 const order = [];
 for(let d = 1; d < rows.length; d++){ if(rows[at - d]) order.push(rows[at - d]); if(rows[at + d]) order.push(rows[at + d]); }
 return order.length ? order[h2hIdx % order.length] : null;
}
function rivalOwned(){
 const r = nearestRival();
 if(!r || !squad.length) return new Set();
 return new Set(rivalSquad(r.name));
}
function cycleRival(){ h2hIdx++; render(); }
function gapBandHtml(){
 const r = nearestRival();
 if(!r) return "";
 const mine = seasonTotal(), d = mine - r.s;
 const glyph = d > 0 ? "▲ " : d < 0 ? "▼ " : "= ";
 const partial = squad.length && squad.length < SQUAD_SIZE
   ? ' <span class="gapb__part">' + esc(t("partialTeam")) + "</span>" : "";
 return '<button type="button" class="gapb" onclick="cycleRival()" aria-label="' + esc(t("h2hLab")) + '">'
  + '<span class="gapb__who"><span class="gapb__me">' + esc(teamName()) + partial + "</span>"
  + '<span class="gapb__vs">⟷</span>'
  + '<span class="gapb__them">' + esc(r.name) + "</span></span>"
  + '<span class="gapb__nums"><span class="gapb__n me" dir="ltr">' + num(mine) + "</span>"
  + '<span class="gapb__d" data-s="' + signOf(d) + '" dir="ltr">' + glyph + signed(d) + "</span>"
  + '<span class="gapb__n them" dir="ltr">' + num(r.s) + "</span></span></button>";
}

/* ============================================================================
   SWAP AND REORDER — the thing that makes this a manager's game.
   Without it you could own Liverpool and never get it onto the pitch, because
   the picker files clubs in the order they were tapped. A bench club's only
   offered action was "make captain". That is not a squad, it is a receipt.
   ============================================================================ */
let _entryPlayed = false;
let _capDropped = false;
let swapFrom = null;                        /* index in `squad` currently armed for a swap */
function isStarter(i){ return i < START_SIZE; }
function swapArm(i){
 if(i == null || i < 0 || i >= squad.length || !squad[i]) return;   /* empty slots are not swappable */
 if(swapFrom === i){ swapFrom = null; render(); return; }      /* tap again to cancel */
 if(swapFrom === null){ swapFrom = i; render(); return; }
 swapSlots(swapFrom, i);
 swapFrom = null;
 render();
}
function swapSlots(a, b){
 /* BOTH indices must name a club the manager actually owns. The first version wrote to
    any index, so tapping an empty slot beyond the end of the squad extended the array
    with holes - and priceOf(undefined) charged 8.0M for a club that does not exist,
    which blocked every remaining club and made the squad impossible to complete. */
 if(a === b || a == null || b == null) return;
 if(a < 0 || b < 0 || a >= squad.length || b >= squad.length) return;
 if(!squad[a] || !squad[b]) return;
 const tmp = squad[a]; squad[a] = squad[b]; squad[b] = tmp;
 /* the captain must always be one of the eleven: a swap that benches him would leave the
    armband showing while silently paying nothing (measured: 67 -> 51 points) */
 /* Never silently reassign the armband. Benching the captain used to hand it to whatever
    club happened to occupy slot 0 - measured 8 silent reassignments in 200 swaps, once
    swinging a round by 17 points. Clear it and say so; the manager chooses. */
 if(captain && squad.indexOf(captain) >= START_SIZE){ captain = null; _capDropped = true; }
 save();
}
/* promote a substitute straight into the XI, replacing a chosen starter */
function promoteSub(subIndex, starterIndex){ swapSlots(subIndex, starterIndex); render(); }
function swapLabel(i){
 if(swapFrom === null) return "";
 if(swapFrom === i) return t("swapCancel");
 return isStarter(swapFrom) !== isStarter(i) ? t("swapHere") : t("swapWith");
}

/* a complete legal squad, built for the user, so step 3 of the wizard is never an empty board */
function autoFill(){
 const pool = CLUBS.slice().sort((a, b) => priceOf(b.id) - priceOf(a.id));
 while(squad.length < SQUAD_SIZE){
  let added = false;
  for(const c of pool){
   if(squad.includes(c.id)) continue;
   if(blockReason(c)) continue;
   squad.push(c.id); added = true; break;
  }
  if(!added) break;
 }
 save(); paintPicker();
}

                size: SQUAD_SIZE, startSize: START_SIZE, budget: BUDGET,
                maxPerLeague: MAX_PER_LEAGUE, minPrice: MIN_CLUB_PRICE, seed: 20260816,
                gw: {no: CURRENT_GW, from: gwFrom, to: gwTo,
                     lock: ["الجمعة 8:30 مساءً", "Fri 8:30pm"],

 tutMount();
 const f = $("wizBox").querySelector("[data-tut-focus]");
 if(f) f.focus({preventScroll:true});
 $("wizBox").scrollTop = 0;
});
function closeWizard(){
 /* Re-arm the walk-out. boot() paints the pitch and then covers it with the wizard, so the
    entry sequence was being spent behind a z-index 120 modal — every run, since the demo
    resets on load. Nobody had ever seen it. It plays when the pitch is first REVEALED. */
 _entryPlayed = false;
 $("wiz").classList.add("hide");
 document.body.classList.remove("gk-lock");
 try{ localStorage.setItem("fx_onboarded", "1"); }catch(_){}
 render();
}
function wizNext(){ wizStep++; if(wizStep > 3) return closeWizard(); paintWizard(); }
function paintWizard(){
 const dots = '<div class="wizdots">' + [0,1,2,3].map(i => '<span class="wizdot' + (i === wizStep ? " on" : "") + '"></span>').join("") + "</div>";
 let body = "";
 if(wizStep === 0){
  body = '<div class="wizart">⚽</div><div class="wizh">' + esc(t("wiz1h")) + '</div><div class="wizp">' + t("wiz1p") + "</div>";
 } else if(wizStep === 1){
  body = '<div class="wizart">💰</div><div class="wizh">' + esc(t("wiz2h")) + '</div><div class="wizp">' + t("wiz2p") + "</div>";
 } else if(wizStep === 2){
  if(squad.length < SQUAD_SIZE) autoFill();
  body = '<div class="wizh">' + esc(LANG === "ar" ? "جهزنالك فريق" : "We built you a team") + "</div>"
   + '<div class="wizp">' + t("wiz3p") + "</div>" + budgetHtml() + pitchHtml(false)
   + '<button type="button" class="btn ghost" onclick="closeWizard();openPicker()">' + esc(t("changeTeam")) + "</button>";
 } else {
  if(!captain && squad.length) captain = squad[0];
  body = '<div class="wizart">🎖️</div><div class="wizh">' + esc(t("wiz4h")) + '</div>'
   + '<div class="wizp">' + esc(t("wiz4p")) + "</div>"
   + squad.map(id => { const c = CLUBS.find(x => x.id === id); if(!c) return "";
      return '<button type="button" class="clubrow' + (captain === id ? " on" : "") + '" onclick="captain=\'' + esc(id) + '\';save();paintWizard()">'
       + kitHtml(c, "k34") + '<span class="crname"><span class="crn">' + esc(clubName(c)) + "</span></span>"
       + '<span class="crpick">' + (captain === id ? "C" : "+") + "</span></button>"; }).join("");
 }
 $("wizBox").innerHTML = dots + body
  + '<button type="button" class="btn" onclick="wizNext()">' + esc(wizStep === 3 ? t("done") : t("next")) + "</button>"
  + (wizStep < 3 ? '<button type="button" class="btn ghost" onclick="closeWizard()">' + esc(t("skip")) + "</button>" : "");
 save();
}

function resetDemo(){
 squad = []; captain = null; swapFrom = null;
 try{ localStorage.removeItem("fx_squad"); localStorage.removeItem("fx_cap");
      localStorage.removeItem("fx_onboarded"); localStorage.removeItem("fx_coach");
      localStorage.removeItem("fx_team"); localStorage.removeItem("fx_ledger"); }catch(_){}
 seenCoach = {}; coachShownThisSession = false;
 closeSheet(); paintChrome(); render(); openWizard();
}

function toggleLang(){
 clearArm();
 LANG = LANG === "ar" ? "en" : "ar";
 try{ localStorage.setItem("fx_lang", LANG); }catch(_){}
 paintChrome(); render();
 if(TS && !$("wiz").classList.contains("hide")){ TS = tutReduce(TS, {type:"LANG", arg: LANG}); tutMount(); }
 if(!$("sheet").classList.contains("hide")) closeSheet();
}

/* ---------------- boot ---------------- */
(async function boot(){
 try{
  const [cj, pj, kj] = await Promise.all([
   fetch("clubs.json").then(r => r.json()),
   fetch("prices.json").then(r => r.json()),
   /* calendar.json shipped from the very first build and was read by NOTHING — not
      index.html, not modules.js. The blank badge was inventing its own fixture list. */
   fetch("calendar.json").then(r => r.json()).catch(() => null)
  ]);
  CLUBS = cj.clubs; LEAGUES = cj.leagues;
  for(const p of pj.clubs) PRICES[p.id] = p;
  if(kj && kj.gws) CAL = kj;
 }catch(e){
  document.querySelector(".wrap").innerHTML = '<div class="card">Could not load club data.</div>';
  return;
 }
 load();
 paintChrome();
 render();
 let onboarded = "";
 try{ onboarded = localStorage.getItem("fx_onboarded") || ""; }catch(_){}
 if(!onboarded) openWizard();
})();
</script>
</body>
