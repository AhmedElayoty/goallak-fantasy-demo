<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070B1A">
<title>جولك فانتازي · Goallak Fantasy — DEMO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚽</text></svg>">
<!-- The five design modules, built from modules/*.js by scripts/build-bundle.mjs.
     Sibling files rather than inlined: the sources are 325KB and inlining would take the
     page from 72KB to ~400KB, destroying the load-time advantage that is this product's
     one measured edge. These change rarely and cache independently of index.html. -->
<link rel="stylesheet" href="modules.css">
<style>
/* ============================================================================
   GOALLAK FANTASY — ONE MODE ONLY.
   No light theme, no dark theme, no toggle. Every token is declared here and
   nothing inherits from a themed parent, so the look cannot drift.
   Palette + contrast ratios are from design/fantasy-color.md (all measured).
   ============================================================================ */
:root{
 --fx-bg:#070B1A; --fx-surface:#101736; --fx-surface-2:#182246; --fx-surface-3:#212D57;
 --fx-scrim:rgba(3,5,14,.82);
 --fx-line:#2A3560; --fx-line-2:#3D4C82; --fx-line-3:#55689F;
 --fx-ink:#F2F5FF; --fx-ink-dim:#A9B7E4; --fx-ink-mute:#7C8AB8;
 --fx-gold:#FFC53D; --fx-pos:#3BE07F; --fx-neg:#FF6070; --fx-acc:#FF7A45;
 --fx-live:#35D0F5; --fx-chip:#A77BFF; --fx-urgent:#FF3B5C; --fx-blank:#63719C;
 --t1:#FFD24A; --t2:#FF8A3D; --t3:#7E8CC8; --t4:#49578A; --t5:#2A3560;
 --r:14px; --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
 background:var(--fx-bg); color:var(--fx-ink);
 font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Arabic",Tahoma,sans-serif;
 font-size:15px; line-height:1.5;
 padding-bottom:78px;
 overflow-x:hidden;
}
body.gk-lock{position:fixed;width:100%;overflow:hidden}
button,input,select{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--fx-gold);outline-offset:2px;border-radius:6px}
.hide{display:none !important}
[dir=ltr]{unicode-bidi:isolate}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0A1024 0%,rgba(10,16,36,.96) 100%);
 border-bottom:1px solid var(--fx-line);padding:10px var(--pad);display:flex;align-items:center;gap:10px}
.hbrand{display:flex;flex-direction:column;min-width:0;flex:1}
.hname{font-size:17px;font-weight:900;letter-spacing:.2px}
.hname b{color:var(--fx-gold)}
.hsub{font-size:10.5px;color:var(--fx-ink-mute)}
.hbtn{width:38px;height:38px;border-radius:11px;background:var(--fx-surface-2);border:1px solid var(--fx-line);
 display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:0 0 auto}
/* was gold-on-navy at 12.4:1 - the brightest thing on the screen was a debug label */
.demoTag{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--fx-ink-mute);
 background:transparent;border:1px solid var(--fx-line-2);padding:2px 6px;border-radius:5px;flex:0 0 auto}

/* ---------- shell ---------- */
.wrap{padding:var(--pad);max-width:560px;margin:0 auto}
.seg{display:flex;gap:6px;background:var(--fx-surface);border:1px solid var(--fx-line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:800;color:var(--fx-ink-dim)}
.seg button.on{background:var(--fx-surface-3);color:var(--fx-ink);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.card{background:var(--fx-surface);border:1px solid var(--fx-line-2);border-radius:var(--r);padding:var(--pad);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:900;color:var(--fx-ink)}
.muted{color:var(--fx-ink-mute);font-size:12px}
.dim{color:var(--fx-ink-dim)}

/* ---------- the kit tile: club identity WITHOUT any crest ----------
   Club trademarks are not licensed by any football data feed, so colours + pattern
   ARE the identity. Nine patterns, pure CSS, percentage-based so one rule works at
   every size. `sash` deliberately never mirrors in RTL. */
.fxkit{position:relative;border-radius:12px;flex:0 0 auto;overflow:hidden;display:flex;
 align-items:center;justify-content:center;background:var(--c1)}
/* SOLID kits must still use --c2, or 61 clubs discard it and the 12 white ones
   (Real Madrid, Leeds, Spurs, Sevilla, Fulham, Valencia...) render as identical blank
   rectangles. A collar and cuffs is what a real plain kit actually has. */
.fxkit[data-pat="solid"]{background:
 linear-gradient(180deg, var(--c2) 0 12%, transparent 12%),
 linear-gradient(90deg, var(--c2) 0 10%, transparent 10% 90%, var(--c2) 90%),
 var(--c1)}
.fxkit[data-pat="stripes"]{background:repeating-linear-gradient(90deg,var(--c1) 0 14.285%,var(--c2) 14.285% 28.571%)}
.fxkit[data-pat="hoops"]{background:repeating-linear-gradient(180deg,var(--c1) 0 20%,var(--c2) 20% 40%)}
.fxkit[data-pat="halves"]{background:linear-gradient(90deg,var(--c1) 0 50%,var(--c2) 50%)}
.fxkit[data-pat="sash"]{background:linear-gradient(58deg,var(--c1) 0 38%,var(--c2) 38% 62%,var(--c1) 62%)}
.fxkit[data-pat="band"]{background:linear-gradient(180deg,var(--c1) 0 62%,var(--c2) 62%)}
.fxkit[data-pat="diagonal"]{background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50%)}
.fxkit[data-pat="chevron"]{background:linear-gradient(45deg,var(--c2) 0 24%,transparent 24%),linear-gradient(-45deg,var(--c2) 0 24%,transparent 24%),var(--c1)}
.fxkit[data-pat="sleeves"]{background:linear-gradient(90deg,var(--c2) 0 16%,var(--c1) 16% 84%,var(--c2) 84%)}
[dir=rtl] .fxkit[data-pat="sash"]{background:linear-gradient(58deg,var(--c1) 0 38%,var(--c2) 38% 62%,var(--c1) 62%)}
/* three rim tiers, chosen by tile luminance at BUILD time, never at runtime */
.fxkit[data-rim="contain"]{border:2px solid rgba(6,10,26,.62);box-shadow:0 2px 8px rgba(0,0,0,.55)}
.fxkit[data-rim="standard"]{border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.fxkit[data-rim="rescue"]{border:2px solid rgba(255,255,255,.86);box-shadow:0 0 0 3px rgba(255,255,255,.10),0 2px 6px rgba(0,0,0,.45)}
/* isoluminant kits (Barcelona) get a hairline seam or the stripes fuse into one field */
.fxkit[data-iso="1"][data-pat="stripes"]{background:repeating-linear-gradient(90deg,
 var(--c1) 0 13.6%, rgba(0,0,0,.55) 13.6% 14.285%, var(--c2) 14.285% 27.9%, rgba(0,0,0,.55) 27.9% 28.571%)}
.fxkit::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(120% 80% at 30% 12%,rgba(255,255,255,.22),rgba(255,255,255,0) 60%)}
.fxcode{position:relative;z-index:2;font-size:11px;font-weight:900;letter-spacing:.5px;
 color:var(--ink);paint-order:stroke fill;-webkit-text-stroke:.6px rgba(0,0,0,.55)}
.k34{width:34px;height:34px}.k34 .fxcode{font-size:9px}
.k44{width:44px;height:44px}.k44 .fxcode{font-size:10px}
.k60{width:60px;height:60px}.k60 .fxcode{font-size:12.5px}

/* ---------- budget meter ---------- */
.bud{background:var(--fx-surface-2);border:1px solid var(--fx-line);border-radius:12px;padding:11px 12px;margin-bottom:12px}
.budtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.budleft{font-size:20px;font-weight:900;color:var(--fx-gold)}
.budlab{font-size:11px;color:var(--fx-ink-dim)}
.budtrack{height:9px;border-radius:99px;background:#0B1024;border:1px solid var(--fx-line);overflow:hidden;position:relative}
.budfill{height:100%;background:linear-gradient(90deg,var(--fx-acc),var(--fx-gold));transition:inline-size .25s}
/* the reserve floor: the money you MUST keep to fill remaining slots. Hatched, not a number to work out. */
.budresv{position:absolute;inset-block:0;inset-inline-end:0;background:repeating-linear-gradient(45deg,
 rgba(85,104,159,.55) 0 4px,rgba(85,104,159,.18) 4px 8px);border-inline-start:1px solid var(--fx-line-3)}
.budnext{font-size:11.5px;color:var(--fx-ink-dim);margin-top:7px;display:flex;justify-content:space-between;gap:8px}
.budnext b{color:var(--fx-ink)}

/* ---------- club rows ---------- */
.clubrow{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;
 background:var(--fx-surface-2);border:1px solid var(--fx-line);margin-bottom:7px;width:100%;text-align:start}
.clubrow.on{background:var(--fx-surface-3);border-color:var(--fx-line-3)}
/* Dim the row, never the reason. The blocked row used opacity:.42 on the whole element,
   which dragged its explanation down to 1.92:1 - the usability study timed a tester quitting
   at that exact moment, unable to see why Liverpool would not respond to a tap. */
.clubrow[disabled]{cursor:not-allowed}
.clubrow[disabled] .fxkit{opacity:.42}          /* only the kit dims - it carries no words */
.clubrow[disabled] .crn{color:var(--fx-ink-dim)}    /* 7.80:1 */
.clubrow[disabled] .crprice{color:var(--fx-ink-mute)} /* 4.56:1 */
.clubrow[disabled] .crpick{color:var(--fx-ink-dim);background:transparent}
.clubrow[disabled] .crwhy{opacity:1}
.crname{flex:1;min-width:0}
.crn{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crl{font-size:10.5px;color:var(--fx-ink-mute)}
.crwhy{font-size:10.5px;color:var(--fx-neg)}
.crprice{font-size:13px;font-weight:900;color:var(--fx-gold);flex:0 0 auto}
.crpick{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--fx-acc);color:#0B1020;
 font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
.clubrow.on .crpick{background:var(--fx-pos)}

/* ---------- pitch ---------- */
/* ============================================================================
   THE STADIUM
   A raked turf plane with the cards standing flat and upright on top of it.
   ONE transform does the perspective: rotateX on the turf only. The cards never
   rotate — a tilted card is unreadable and stops looking like an object you own.
   Everything is CSS. No images anywhere in this file.
   ============================================================================ */
:root{
 --fx-turf-a:#0E5E33; --fx-turf-b:#0C5430;    /* the two mow stripes, CR 1.16 apart */
 --st-rake:24deg;
 --cw:clamp(54px, 15.4vw, 68px);               /* card width. 54 floor x .90 GK depth = 48.6px > 48 */
}
/* ---- THE SECOND ACT ----
   A stadium that is identical on open #40 and open #1 is a screenshot, not a product.
   Four things drift across a season. Nothing is random, nothing is announced, and none of
   it confers any advantage — it is only ever a reflection of what you already did.
     · the SKY moves dusk -> night -> December Nights -> golden hour at the run-in
     · the CROWD fills as your group fills (one number, driven by friends joined)
     · the TURF wears: the centre circle's trodden ring grows, a goalmouth scuff appears
     · the PERIMETER goes gold while you are alive in the cup                          */
.st{position:relative;border-radius:var(--r);overflow:hidden;isolation:isolate;
 aspect-ratio:10/14;max-height:70vh;border:1px solid var(--fx-line-2);
 --crowd-a:.34; --wear:.055; --scuff:0;
 background:radial-gradient(120% 80% at 50% -10%, var(--sky-1,#14204A) 0%, var(--sky-2,#0A1130) 46%, #070B1A 100%)}
.st[data-sky="dusk"]    {--sky-1:#2A2560;--sky-2:#141A44}
.st[data-sky="night"]   {--sky-1:#14204A;--sky-2:#0A1130}
.st[data-sky="december"]{--sky-1:#0E1838;--sky-2:#070C24}
.st[data-sky="golden"]  {--sky-1:#3A2E58;--sky-2:#161B42}
/* alive in the cup: a gold hairline round the whole ground */
.st[data-cup="1"]{border-color:rgba(255,210,74,.50);box-shadow:0 0 0 1px rgba(255,210,74,.28) inset}
/* --- the four floodlight pools, painted on the sky --- */
.st__sky{position:absolute;inset:0;z-index:1;
 background:
  radial-gradient(50% 34% at 16% 8%, rgba(190,214,255,.16), transparent 70%),
  radial-gradient(50% 34% at 84% 8%, rgba(190,214,255,.16), transparent 70%)}
/* --- two pylons, not four: at this crop only the far pair is in frame --- */
.st__pylon{position:absolute;top:2%;width:26px;height:16%;z-index:2}
.st__pylon.a{inset-inline-start:9%} .st__pylon.b{inset-inline-end:9%}
.st__pylon i{position:absolute;inset-inline:0;top:0;height:9px;border-radius:2px;
 background:linear-gradient(180deg,#E8F0FF,#9DB2DA);box-shadow:0 0 12px 3px rgba(200,222,255,.55)}
.st__pylon u{position:absolute;inset-inline-start:50%;top:9px;bottom:0;width:2px;margin-inline-start:-1px;
 background:linear-gradient(180deg,#3D4C82,#1A2244)}
/* --- the stands: three crowd grids at different scales so it never visibly repeats --- */
/* the crowd density IS your group: --crowd-a = .34 + .072 x friends joined.
   The social loop made visible in the object you look at every day, for one number. */
.st__stand{position:absolute;inset-inline:-2%;top:9%;height:15%;z-index:2;opacity:.85;
 background:
  radial-gradient(circle at 25% 30%, rgba(255,255,255,calc(var(--crowd-a) * .38)) 0 1px, transparent 1.6px) 0 0/7px 6px,
  radial-gradient(circle at 70% 65%, rgba(255,255,255,calc(var(--crowd-a) * .30)) 0 1px, transparent 1.6px) 3px 2px/11px 9px,
  radial-gradient(circle at 45% 50%, rgba(120,150,220,calc(var(--crowd-a) * .41)) 0 1px, transparent 1.6px) 1px 4px/5px 8px,
  linear-gradient(180deg,#141C3E,#0C1330);
 border-bottom:1px solid rgba(255,255,255,.10)}
/* --- the playing surface --- */
.st__stage{position:absolute;inset:0;z-index:3;perspective:820px;perspective-origin:50% 118%}
.st__turf{position:absolute;inset-inline:-3%;top:23%;bottom:0;transform-origin:50% 100%;
 transform:rotateX(var(--st-rake));
 background:
  radial-gradient(ellipse 26% 9% at 50% 2%, rgba(255,255,255,calc(var(--scuff) * .07)) 0 60%, transparent 72%),
  radial-gradient(circle at 50% 47%, rgba(255,255,255,var(--wear)) 0 16.5%, transparent 17.4%),
  repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px),
  repeating-linear-gradient(90deg, rgba(0,0,0,.030) 0 1px, transparent 1px 3px),
  repeating-linear-gradient(90deg, var(--fx-turf-a) 0 8.3333%, var(--fx-turf-b) 8.3333% 16.6667%),
  var(--fx-turf-b);
 box-shadow:inset 0 34px 56px -26px rgba(0,0,0,.62), inset 0 -44px 64px -34px rgba(0,0,0,.50)}
/* markings ride the same plane so they warp with it */
.st__mark{position:absolute;inset:0;pointer-events:none;
 background:
  radial-gradient(circle at 50% 47%, transparent 0 16.2%, rgba(255,255,255,.30) 16.2% 16.8%, transparent 17.2%),
  linear-gradient(180deg, transparent calc(47% - 1px), rgba(255,255,255,.26) calc(47% - 1px) calc(47% + 1px), transparent calc(47% + 1px))}
.st__box{position:absolute;inset-inline:26%;top:0;height:15%;border:2px solid rgba(255,255,255,.24);
 border-top:none;pointer-events:none}
/* --- the card layer: flat, upright, never rotated --- */
.st__cards{position:absolute;inset:0;z-index:6}
/* translate(-50%) is PHYSICAL: it always moves left. Anchored with inset-inline-start, that
   centres the card correctly in LTR and throws it a full card-width off the pitch in RTL —
   which is Arabic, the default. The shift is a token so the keyframes inherit it too. */
.slot{position:absolute;--tx:-50%;transform:translate(var(--tx),-50%);display:flex;flex-direction:column;
 align-items:center;gap:3px;width:calc(var(--cw) * var(--depth,1))}
[dir=rtl] .slot{--tx:50%}
/* ============================================================================
   THE CLUB CARD — the kit becomes a JERSEY on a card, not a coloured square.
   The 3-letter code moves off the kit onto a plate, which takes it from a
   per-club outline hack to a flat 18.1:1 for all 126 clubs.
   The rim metal encodes the price band, so value reads at a glance.
   ============================================================================ */
.cc{position:relative;width:100%;aspect-ratio:60/79;border-radius:9px;overflow:hidden;
 background:#0B1024;border:1.5px solid var(--metal,#3D4C82);
 box-shadow:0 4px 10px -4px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.35);
 display:flex;flex-direction:column;padding:0}
/* The bands escalate on FOUR properties, not just hue — rim weight, gloss, elevation and
   ground. Sorare's own designers put it best: scarcity is expressed as DEPTH, with common
   cards "clean and simple and more or less flat" and the rarest ones darker "so we can
   better highlight the contrast between light and dark". Hue alone is the weak half of the
   idea; a budget card here is deliberately flat, an elite card is an object. */
.cc[data-band="elite"] {--metal:#FFD24A;--rim:2px;--gloss:.20;background:#080C1C;
 box-shadow:0 6px 18px -5px rgba(255,210,74,.30), 0 5px 12px -4px rgba(0,0,0,.80)}
.cc[data-band="strong"]{--metal:#D9DEEF;--rim:1.75px;--gloss:.15;
 box-shadow:0 5px 14px -5px rgba(0,0,0,.75)}
.cc[data-band="mid"]   {--metal:#B08D57;--rim:1.5px;--gloss:.11;
 box-shadow:0 4px 11px -5px rgba(0,0,0,.70)}
.cc[data-band="value"] {--metal:#6D7CA8;--rim:1.25px;--gloss:.08;
 box-shadow:0 3px 8px -4px rgba(0,0,0,.62)}
.cc[data-band="budget"]{--metal:#46527E;--rim:1px;--gloss:.06;box-shadow:none}
.cc{border-width:var(--rim,1.5px)}
.cc__shirtwrap::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(150deg, rgba(255,255,255,var(--gloss,.08)) 0 34%, rgba(255,255,255,0) 62%)}
.cc__shirtwrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
/* one clip-path, mirror-symmetric, so RTL never has to flip it */
.cc__shirt{width:67%;aspect-ratio:40/44;position:relative;
 clip-path:polygon(31% 0%,40% 5%,60% 5%,69% 0%,100% 13%,100% 36%,84% 41%,84% 100%,16% 100%,16% 41%,0% 36%,0% 13%)}
.cc__plate{height:26%;min-height:19px;display:flex;align-items:center;justify-content:space-between;
 padding:0 5px;border-top:1px solid rgba(255,255,255,.09);background:rgba(6,10,26,.72)}
.cc__code{font-size:11px;font-weight:900;letter-spacing:.4px;color:#F2F5FF}
.cc__val{font-size:11px;font-weight:900;color:var(--fx-gold)}
.cc__val.pts{color:var(--fx-pos)}
.cc__arm{position:absolute;inset-block-start:5px;inset-inline-start:0;z-index:4;
 background:var(--fx-gold);color:#0B1020;font-size:8.5px;font-weight:900;padding:1px 5px;
 border-start-end-radius:4px;border-end-end-radius:4px;letter-spacing:.4px}
 /* The name scales with the viewport and may take TWO lines. Fixed 10px with nowrap+ellipsis
    turned a long Arabic club name into an ellipsis on a small phone, which is the same as no
    name at all. */
.slot .nm{font-size:clamp(8.5px, 2.6vw, 11px);font-weight:800;color:#F2F5FF;
 width:calc(var(--cw) * 1.6);max-width:26vw;line-height:1.15;text-align:center;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
 text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 6px rgba(0,0,0,.7)}
.slot .plinth{width:62%;height:6px;border-radius:50%;margin-top:-2px;
 background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.55), transparent 70%)}
/* an empty slot should look like a shirt waiting on a peg, not a failed image */
.cc--empty{border-style:dashed;border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.05);
 align-items:center;justify-content:center;color:rgba(255,255,255,.72);font-size:20px;font-weight:300}
.cc--empty .cc__shirtwrap{opacity:.34}
.cc--empty .cc__plus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px}

/* ---------- the dugout ---------- */
.dug{margin-top:10px;background:linear-gradient(180deg,#0E1430,#0A1026);border:1px solid var(--fx-line-2);
 border-radius:var(--r);padding:10px 10px 12px}
.dug__lab{font-size:10.5px;color:var(--fx-ink-mute);margin-bottom:8px;text-align:center}
.dug__row{display:flex;gap:8px;justify-content:space-between}
.subslot{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
/* a substitute must never out-weigh a starter: the bench rendered at 75x99 against the
   XI's 49x64, making the reserves the biggest objects on the screen */
.subslot .cc{width:min(100%, calc(var(--cw) * .78))}
.slot.armed .cc, .subslot.armed .cc{outline:3px solid var(--fx-gold);outline-offset:2px}
.swaphint{position:relative;z-index:6;font-size:8.5px;font-weight:900;color:#0B1020;
 background:var(--fx-gold);padding:1px 5px;border-radius:4px;white-space:nowrap}
.subslot .ord{position:absolute;inset-block-start:-4px;inset-inline-start:-3px;z-index:5;width:16px;height:16px;
 border-radius:50%;background:var(--fx-surface-3);border:1px solid var(--fx-line-3);color:var(--fx-ink-dim);
 font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center}
.subslot .nm{font-size:9px;font-weight:700;color:var(--fx-ink-dim);max-width:100%;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
/* a sub that actually came on: the fourth official's board, lit */
.subslot.on .cc{border-color:var(--fx-pos)}
.subslot.on .camein{font-size:8.5px;font-weight:900;color:#08210F;background:var(--fx-pos);
 padding:1px 5px;border-radius:4px;text-shadow:none}

/* ---------- tier dots ---------- */
.tier{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--fx-ink-dim)}
.tdot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- points ---------- */

const $ = id => document.getElementById(id);

/* ELEVEN clubs — a football XI. The squad is a team sheet, not a shopping list.
   Budget solved, not guessed, then CONFIRMED by the pricing model: 100.0M buys exactly THREE
   elite clubs (91.5M) and a fourth costs 105.5M. Three is what makes 'which three?' the whole
   conversation.
   The floor is 4.5M, NOT 4.0M, and that coupling matters: at 4.5 a fourth elite strands all seven
   remaining slots at the floor, which is what enforces the ceiling. At 4.0 the fourth becomes
   comfortable and the tension quietly disappears. */
const START_SIZE = 11, BENCH_SIZE = 4;
const SQUAD_SIZE = START_SIZE + BENCH_SIZE;          /* 15 clubs owned, 11 of them on the pitch */
const BUDGET = 120.0, MAX_PER_LEAGUE = 3, MIN_CLUB_PRICE = 4.5;
/* Why 120.0M: the bench is priced at +5.0M per slot, which holds the ceiling at exactly THREE
   elite clubs across all 15 (109.5M) — a fourth needs 123.5M. The same decision the 11-club
   budget was built around, preserved at the larger squad. */
/* rows of the formation, back to front. 1-4-4-2 = 11. */
const FORMATIONS = {
 "4-4-2": [1, 4, 4, 2],
 "4-3-3": [1, 4, 3, 3],
 "3-5-2": [1, 3, 5, 2]
};
/* ============================================================================

   FIRST-RUN experience, and a half-finished squad from last time hides exactly
   what he came to look at. So every page load starts clean — new onboarding,
   empty squad, coach marks re-armed, Arabic.
   State still persists WITHIN a session, so the app behaves normally while you
   use it; it is only wiped when the page loads.

(function resetOnOpen(){
 try{

 }catch(_){}

let LANG = "ar";
try{ LANG = localStorage.getItem("fx_lang") || "ar"; }catch(_){}

let CLUBS = [], LEAGUES = [], PRICES = {};

 wiz3h:["جهزنالك فريق","We built you a team"],
 wiz3p:["دي بداية كاملة ومظبوطة. سيبها زي ما هي، أو غيّر اللي مش عاجبك.",
        "This is a complete, legal starting squad. Keep it, or change whatever you like."],
 wiz4h:["اختار الكابتن","Choose your captain"],
 wiz4p:["نادي واحد بس بياخد ضعف النقط. اختاره كويس.","One club scores double. Choose well."],
 autoPick:["املا الباقي لوحده","Auto-pick"],
 coachBudget:["الشريط ده فلوسك. الجزء المخطط محجوز للأماكن اللي لسه فاضية.","This bar is your money. The hatched part is reserved for your empty slots."],
 coachCap:["دوس على أي نادي عشان تخليه الكابتن.","Tap any club to make it your captain."],
 coachPts:["دوس على نقاط أي نادي عشان تشوف جت منين بالظبط.","Tap any club's points to see exactly how they were earned."],
 gotIt:["فهمت","Got it"],
 tierLab:["قوة الخصم","Opponent strength"],
 tier1:["بطل","Elite"],tier2:["قوي","Strong"],tier3:["متوسط","Mid"],tier4:["ضعيف","Weak"],tier5:["الأضعف","Weakest"],
 priceLab:["السعر","Price"],

for(const bag of ["GW_STR", "CHIP_STR", "TUT_STR", "SHARE_STR", "LND_STR"]){
 try{ if(typeof window[bag] === "object" && window[bag]) Object.assign(STR, window[bag]); }catch(_){}
}
function t(k){ const e = STR[k]; return e ? e[LANG === "ar" ? 0 : 1] : k; }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Western digits everywhere, per the app's own rule */
const num = n => String(n);

function clubName(c){ return LANG === "ar" && c.ar ? c.ar : (c.short || c.name); }
function leagueName(id){ const l = LEAGUES.find(x => x.id === id); return l ? (LANG === "ar" ? l.ar : l.en) : id; }
/* 0, not 8: a default price hid a corrupted squad by making a phantom club look affordable */
function priceOf(id){ return id && PRICES[id] ? PRICES[id].price : 0; }
function tierOf(id){ return PRICES[id] ? PRICES[id].tier : "mid"; }

 return '<span class="fxkit ' + (size || "k44") + '" data-pat="' + esc(c.pat) + '" data-rim="' + esc(c.rim) + '"'
  + (c.iso ? ' data-iso="1"' : "")
  + ' style="--c1:' + esc(c.c1) + ';--c2:' + esc(c.c2) + ';--ink:' + esc(c.ink) + '">'

/* ---------------- budget maths ----------------
   The reserve floor is what makes overspending unreachable instead of punished:
   you can never spend money that the remaining slots still need. */
function spent(){ return squad.reduce((a, id) => a + priceOf(id), 0); }
function remaining(){ return +(BUDGET - spent()).toFixed(1); }
function slotsLeft(){ return SQUAD_SIZE - squad.length; }
function reserve(){ return Math.max(0, (slotsLeft() - 1)) * MIN_CLUB_PRICE; }
function maxNextPrice(){ return slotsLeft() <= 0 ? 0 : +(remaining() - reserve()).toFixed(1); }
function leagueCount(lg){ return squad.filter(id => (CLUBS.find(c => c.id === id) || {}).lg === lg).length; }

/* why a club cannot be picked — printed on the row, so there is no error state */
function blockReason(c){
 if(squad.includes(c.id)) return null;
 if(slotsLeft() <= 0) return t("squadFull");
 if(leagueCount(c.lg) >= MAX_PER_LEAGUE) return t("leagueFull");
 if(priceOf(c.id) > maxNextPrice()) return t("tooExpensive");
 return null;
}

 try{

 }catch(_){}
}
let squadWasRepaired = false;
function load(){
 try{
  squad = JSON.parse(localStorage.getItem("fx_squad") || "[]");
  captain = localStorage.getItem("fx_cap") || null;
 }catch(_){ squad = []; captain = null; }
 if(!Array.isArray(squad)) squad = [];

/* A STORED squad can become illegal without the user touching anything: prices move, a club
   is relegated out of the pool, the rules change. Never trust what came out of storage —
   rebuild it into a legal state and say so, rather than rendering an over-budget team. */
function validateSquad(){
 const before = squad.length;
 squad = squad.filter(id => CLUBS.some(c => c.id === id));      /* club no longer in the pool */
 const kept = [], seenLg = {};
 for(const id of squad){
  const c = CLUBS.find(x => x.id === id);
  const lg = c.lg;
  if((seenLg[lg] || 0) >= MAX_PER_LEAGUE) continue;             /* league cap tightened */
  const cost = kept.reduce((a, k) => a + priceOf(k), 0) + priceOf(id);
  /* Keeping a club must not strand the user. The FIRST version of this only checked the
     budget, and produced a squad of 5 with 9.5M left for 3 slots that needed 12M — legal
     but impossible to finish. Apply the same reserve floor the picker enforces, so a
     repaired squad is always completable. */
  const needForRest = (SQUAD_SIZE - (kept.length + 1)) * MIN_CLUB_PRICE;
  if(cost + needForRest > BUDGET) continue;                      /* prices rose past the budget */
  seenLg[lg] = (seenLg[lg] || 0) + 1;
  kept.push(id);
 }
 if(kept.length !== before || squad.length !== before) squadWasRepaired = true;
 squad = kept;
 if(captain && !squad.includes(captain)) captain = null;
 save();
}

function hash(str){ let h = 2166136261; for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); }
function simMatch(clubId, gw){
 /* No CLUBS.find() here. It used to look the club up and discard the result — a 126-item
    linear scan on every call, which at GW36 is ~340,000 wasted comparisons per leaderboard. */
 const h = hash(clubId + "|" + gw);
 const strength = { elite:.62, strong:.52, mid:.42, value:.34, budget:.28 }[tierOf(clubId)] || .4;
 const roll = (h % 1000) / 1000;
 const win = roll < strength, draw = !win && roll < strength + .26;
 const gf = win ? 1 + (h >> 3) % 3 : draw ? (h >> 5) % 2 : (h >> 7) % 2;
 const ga = win ? (h >> 9) % 2 : draw ? gf : 1 + (h >> 11) % 2;
 const oppTier = 1 + (h >> 13) % 5;
 const blank = ((h >> 17) % 11) === 0;      /* no fixture this week */
 if(blank) return {blank:true, pts:0};
 const res = win ? 6 : draw ? 2 : 0;
 const clean = ga === 0 ? 4 : 0;
 const goals = gf * 1;
 const conc = -Math.floor(ga / 2);
 const tierBonus = win ? [0,3,2,1,0,0][oppTier] : 0;
 return {blank:false, win, draw, gf, ga, oppTier, res, clean, goals, conc, tierBonus,
         pts: res + clean + goals + conc + tierBonus};
}
/* AUTOMATIC SUBSTITUTION.
   A club with no fixture scores nothing, and the scenario analysis measured that an XI with no
   bench forfeits 158 points a season — 4.2% — to blanks it cannot cover. So a blanked starter is
   replaced, in bench order, by the first substitute who actually has a match. Each sub can only
   come on once. This returns the whole picture, not just a number, because the points screen has
   to be able to SHOW what happened. */
function resolveGw(gw){
 const starters = squad.slice(0, START_SIZE);
 const bench = squad.slice(START_SIZE);
 const used = {};
 const lineup = [];
 for(const id of starters){
  const m = simMatch(id, gw);
  if(!m.blank){ lineup.push({id: id, m: m, sub: null}); continue; }
  let replacement = null;
  for(const b of bench){
   if(used[b]) continue;
   const bm = simMatch(b, gw);
   if(bm.blank) continue;
   used[b] = 1; replacement = {id: b, m: bm};
   break;
  }
  lineup.push({id: id, m: m, sub: replacement});   /* sub === null: nobody could cover it */
 }
 let total = 0, covered = 0, uncovered = 0;
 for(const row of lineup){
  const scorer = row.sub || row;
  const isCap = scorer.id === captain;
  total += scorer.m.pts * (isCap ? 2 : 1);
  if(row.sub) covered++;
  else if(row.m.blank) uncovered++;
 }
 return {total: total, lineup: lineup, covered: covered, uncovered: uncovered, used: used};
}
/* The chip has to reach the SCORE, or the confirm sheet is a lie: it promised the captain
   would score x3 and the points screen still showed x2. applyChip needs three facts
   resolveGw does not carry, so they are attached before it runs. */
function activeChipFor(gw){
 const p = chipPlays.find(x => x.gw === gw && x.state !== "cancelled");
 return p ? p.chip + "-" + p.half : null;
}
function scoreGw(gw){
 const res = resolveGw(gw);
 const id = activeChipFor(gw);
 if(!id || typeof applyChip !== "function") return res;
 res.captain = captain;
 res.vice = null;
 res.bench = squad.slice(START_SIZE).map(cid => ({id: cid, m: simMatch(cid, gw)}));
 return applyChip(id, res) || res;
}
function gwTotal(gw){ return scoreGw(gw).total; }
/* DEMO ONLY: a scrubber so the season can be walked in ten seconds instead of nine months.
   The real product reads the gameweek from the fixture calendar. */
let CURRENT_GW = 6;
let _gwRaf = 0;
function setGw(g){
 clearArm();
 CURRENT_GW = Math.max(1, Math.min(36, g));
 /* on the team screen nothing but the stadium and the label depend on the gameweek, so
    patch in place and never touch the input the user is dragging */
 if(view === "team" && patchTeamGw()) return;
 /* One render per animation frame, not one per input event. Dragging fired render()
    continuously and blew the whole frame budget on a mid-range phone. */
 if(_gwRaf) return;
 _gwRaf = requestAnimationFrame(() => { _gwRaf = 0; render(); });
}
function seasonTotal(){ let s = 0; for(let g = 1; g <= CURRENT_GW; g++) s += gwTotal(g); return s; }

/* Row depth: the plane compresses toward the viewer, so cards grow 90% -> 100% back to front.
   10% is the smallest ramp that reads as depth and the largest that keeps the GK card above
   the 48px tap minimum (54 floor x .90 = 48.6). */
/* Measured against the RENDERED turf, not the flat one. rotateX(24deg) about the bottom
   edge lifts the far edge from 23% to 42.6%, so a row authored at 28% put the goalkeeper
   entirely above the grass — hit-testing under his feet returned sky. */
/* Rows pulled up so the club NAME under the front row still lands inside the pitch. At 91%
   the name fell past the bottom edge and .st{overflow:hidden} ate it - which is why only
   some names were readable on a real phone. */
const ROW_GEOM = [{top:49, depth:0.90}, {top:61, depth:0.94}, {top:73, depth:0.97}, {top:85, depth:1.00}];
/* Horizontal centres by row width. The FOUR-card row is deliberately uneven — 11/35/65/89,
   gaps 24/30/24 — leaving ~46px of open turf down the spine of the team. Distribute those four
   evenly and you get 11px there, and the row instantly reads as a table instead of a back four. */
const ROW_X = {1:[50], 2:[33,67], 3:[20,50,80], 4:[11,35,65,89], 5:[11,30,50,70,89]};

/* Derived from the same deterministic simulation the scoring uses, so the badge can never
   disagree with the points that follow it. Real data would replace only this function. */
function fixtureState(id, gw){
 const m = simMatch(id, gw);
 if(m.blank) return {kind:"blank", matches:0};
 /* NO double badge. The first version invented one from a separate hash the scoring engine
    never reads, so "plays twice" clubs actually averaged 5.21 points against 5.55 for the
    rest - the badge was decorative and wrong. The blank badge IS real: it comes from the
    same simMatch the score comes from, and was measured exact across 4,536 club-rounds. */
 return {kind:"plays", matches:1};
}
function bandOf(id){
 const p = priceOf(id);
 return p >= 15 ? "elite" : p >= 11 ? "strong" : p >= 8 ? "mid" : p >= 6 ? "value" : "budget";
}
function cardHtml(c, withPoints, gw, slotIndex){
 const m = withPoints ? simMatch(c.id, gw) : null;
 const isCap = c.id === captain;
 /* A club with no fixture scores nothing, and until now the only way to discover that was
    to score nothing. The badge says it BEFORE the round, which is the whole point. */
 const fx = fixtureState(c.id, gw == null ? CURRENT_GW : gw);
 const badge = (typeof gwBadge === "function")
   ? gwBadge({lang: LANG, kind: fx.kind, matches: fx.matches}) : "";
 const val = withPoints
  ? (m.blank ? '<span class="cc__val" style="color:var(--fx-blank)">–</span>'
             : '<span class="cc__val pts" dir="ltr">' + num(m.pts * (isCap ? 2 : 1)) + "</span>")
  : '<span class="cc__val" dir="ltr">' + num(priceOf(c.id).toFixed(1)) + "</span>";
 const act = withPoints ? "openBreakdown('" + esc(c.id) + "'," + gw + ")"
   : (slotIndex == null ? "openClub('" + esc(c.id) + "')" : "swapArm(" + slotIndex + ")");
 return '<button type="button" class="cc" data-band="' + bandOf(c.id) + '" onclick="' + act + '">'
  + (isCap ? '<span class="cc__arm">C</span>' : "") + badge
  + '<span class="cc__shirtwrap"><span class="cc__shirt fxkit" data-pat="' + esc(c.pat) + '"'
  + (c.iso ? ' data-iso="1"' : "") + ' style="--c1:' + esc(c.c1) + ';--c2:' + esc(c.c2) + '"></span></span>'
  + '<span class="cc__plate"><span class="cc__code" dir="ltr">' + esc(c.code) + "</span>" + val + "</span>"
  + "</button>";
}
/* The squad as a TEAM SHEET standing on a raked pitch — not a grid of squares. */
function pitchHtml(withPoints, gw){
 const rows = FORMATIONS[formation] || FORMATIONS["4-4-2"];
 /* The season state that drives the second act. All of it is derived from things the game
    already knows — no new data, and none of it changes a single point scored. */
 const gwNow = CURRENT_GW;
 const sky = gwNow <= 4 ? "dusk" : gwNow >= 33 ? "golden" : (gwNow >= 15 && gwNow <= 24) ? "december" : "night";
 const friends = 5;                                   /* demo: the five rivals on the board */
 const crowd = (0.34 + 0.072 * friends).toFixed(3);
 const wear = (0.055 + (0.030 * Math.min(1, gwNow / 36))).toFixed(3);   /* trodden ring grows */
 const scuff = gwNow >= 12 ? 1 : 0;                   /* goalmouth scuff from GW12 */
 const inCup = gwNow >= 15 ? 1 : 0;
 /* The walk-out plays ONCE per session. It used to re-arm on every render, so dragging
    the season slider strobed eleven staggered card animations per input event. */
 const enter = _entryPlayed ? "" : " st--enter";
 _entryPlayed = true;
 let h = '<div class="st' + enter + '" data-sky="' + sky + '" data-cup="' + inCup + '"'
  + ' style="--crowd-a:' + crowd + ';--wear:' + wear + ';--scuff:' + scuff + '">'
  + '<div class="st__sky"></div>'
  + '<div class="st__pylon a"><i></i><u></u></div><div class="st__pylon b"><i></i><u></u></div>'
  + '<div class="st__stand"></div>'
  + '<div class="st__stage"><div class="st__turf"><div class="st__mark"></div><div class="st__box"></div></div></div>'
  + '<div class="st__cards">';
 let i = 0;
 const starters = squad.slice(0, START_SIZE);
 rows.forEach((count, r) => {
  const g = ROW_GEOM[r] || ROW_GEOM[3];
  const xs = ROW_X[count] || ROW_X[4];
  for(let k = 0; k < count; k++, i++){
   const id = starters[i];
   const c = id ? CLUBS.find(x => x.id === id) : null;
   const pos = 'style="inset-inline-start:' + xs[k] + '%;top:' + g.top + '%;--depth:' + g.depth + ';--i:' + i + '"';
   if(!c){
    h += '<div class="slot' + (swapFrom === i ? " armed" : "") + '" ' + pos + '>'
     + '<button type="button" class="cc cc--empty" onclick="' + (swapFrom !== null ? "swapArm(" + i + ")" : "openPicker()") + '"'
     + ' aria-label="' + esc(t("emptySlot")) + '"><span class="cc__plus">+</span></button>'
     + '<span class="plinth"></span>'
     + (!withPoints && swapFrom !== null ? '<span class="swaphint">' + esc(swapLabel(i)) + "</span>" : "") + "</div>";
    continue;
   }
   h += '<div class="slot' + (swapFrom === i ? " armed" : "") + '" ' + pos + '>'
    + cardHtml(c, withPoints, gw, withPoints ? null : i)
    + '<span class="plinth"></span><span class="nm">' + esc(clubName(c)) + "</span>"
    + (swapFrom !== null ? '<span class="swaphint">' + esc(swapLabel(i)) + "</span>" : "") + "</div>";
  }
 });
 h += "</div></div>";
 return h + dugoutHtml(withPoints, gw);
}
/* THE DUGOUT — the bench lives at the touchline, below the pitch, where a real one does.
   A bench is not a compromise on the XI metaphor; it completes it. */
function dugoutHtml(withPoints, gw){
 const bench = squad.slice(START_SIZE);
 const res = withPoints ? scoreGw(gw) : null;
 let h = '<div class="dug"><div class="dug__lab">' + esc(t("benchLab")) + "</div><div class="
  + '"dug__row">';
 for(let i = 0; i < BENCH_SIZE; i++){
  const id = bench[i];
  const c = id ? CLUBS.find(x => x.id === id) : null;
  if(!c){
   const bi0 = START_SIZE + i;
   h += '<div class="subslot"><button type="button" class="cc cc--empty cc--sub" onclick="'
    + (swapFrom !== null ? "swapArm(" + bi0 + ")" : "openPicker()") + '"'
    + ' aria-label="' + esc(t("emptySlot")) + '"><span class="cc__plus">+</span></button>'
    + '<span class="ord" dir="ltr">' + num(i + 1) + "</span></div>";
   continue;
  }
  const cameOn = res && res.used[c.id];
  const bi = START_SIZE + i;
  const armed = swapFrom === bi;
  h += '<div class="subslot' + (cameOn ? " on" : "") + (armed ? " armed" : "") + '">' + cardHtml(c, withPoints, gw, bi)
   + '<span class="ord" dir="ltr">' + num(i + 1) + "</span>"
   + '<span class="nm">' + esc(clubName(c)) + "</span>"
   + (cameOn ? '<span class="camein">' + esc(t("cameOn")) + "</span>" : "")
   + (swapFrom !== null ? '<span class="swaphint">' + esc(swapLabel(bi)) + "</span>" : "") + "</div>";
 }
 return h + "</div></div>";
}

function patchTeamGw(){
 const num_ = $("gwNum"), strip = $("gwStrip");
 if(!num_ || !strip) return false;

 for(let g = 1; g <= 36; g++){

  c.className = "gwchip" + (g === CURRENT_GW ? " on" : g < CURRENT_GW ? " done" : "");

  st.dataset.cup = gw >= 15 ? "1" : "0";

  st.style.setProperty("--scuff", gw >= 12 ? 1 : 0);
 }
 return true;

/* Rivals own REAL squads and are scored by the same engine as the user.
   The first version faked their totals as `hash(name) % 40 + yourScore - k`, which tied every
   rival to the user's own score: three offsets came out positive and two negative, so every
   player sat at exactly 4th of 6 forever, whatever they picked. A leaderboard that cannot move
   is not a leaderboard — and it was the first screen telling the owner the game was over. */
/* names, not transliterations - the leaderboard is the one screen where a user looks for
   someone they know, and Latin names in an Arabic-first product read as placeholder data */
const RIVALS = [["يحيى","Yahia"], ["حجازي","Hegazy"], ["عمر","Omar"], ["كريم","Kareem"], ["مصطفى","Mostafa"]];
const rivalName = r => r[LANG === "ar" ? 0 : 1];
function rivalSquad(name){
 const out = [], byLg = {};
 /* deterministic per rival, but a genuinely different team each — sample the pool by a seeded walk */
 let seed = hash(name);
 const pool = CLUBS.slice().sort((a, b) => priceOf(b.id) - priceOf(a.id));
 let budget = BUDGET;
 for(let guard = 0; guard < 400 && out.length < SQUAD_SIZE; guard++){
  seed = (seed * 1103515245 + 12345) >>> 0;
  const c = pool[seed % pool.length];
  if(out.includes(c.id)) continue;
  if((byLg[c.lg] || 0) >= MAX_PER_LEAGUE) continue;
  const need = (SQUAD_SIZE - out.length - 1) * MIN_CLUB_PRICE;
  if(priceOf(c.id) + need > budget) continue;
  out.push(c.id); byLg[c.lg] = (byLg[c.lg] || 0) + 1; budget -= priceOf(c.id);
 }
 return out;
}
function rivalTotal(name){
 const sq = rivalSquad(name);
 const cap = sq[hash(name + "c") % (sq.length || 1)];
 let total = 0;
 for(let g = 1; g <= CURRENT_GW; g++)
  for(const id of sq) total += simMatch(id, g).pts * (id === cap ? 2 : 1);
 return total;
}
/* الشريط - the share artifact. The captain is the shared referent: one decision, same pool,
   same deadline, settled in 48 hours. That is what makes two managers' rounds comparable. */
function openShare(){
 if(typeof shareStripHtml !== "function" || squad.length < SQUAD_SIZE) return;
 const capClub = CLUBS.find(c => c.id === captain);
 /* starters + bench as SEPARATE arrays - the module orders the grid itself (captain first,
    bench last) and a single `clubs` array silently rendered one tile. */
 const tile = id => { const c = CLUBS.find(x => x.id === id) || {};
   return {code: c.code, name: clubName(c), c1: c.c1, c2: c.c2, pat: c.pat,
           rim: c.rim, ink: c.ink, iso: c.iso}; };
 const st = {lang: LANG, variant: "report", gw: CURRENT_GW, score: gwTotal(CURRENT_GW),
   captain: capClub ? tile(captain) : null,
   starters: squad.slice(0, START_SIZE).map(tile),
   bench: squad.slice(START_SIZE).map(tile)};
 if(st.captain) st.captain.pts = simMatch(captain, CURRENT_GW).pts * 2;
 openSheet('<h2>' + esc(t("shareTitle")) + "</h2>" + shareStripHtml(st)
  + '<div class="note">' + esc(t("shareHint")) + "</div>");
}
function renderBoard(){
 const me = seasonTotal();
 const rivals = RIVALS.map(r => ({n: rivalName(r), s: rivalTotal(r[1])}));
 const rows = rivals.concat([{n:t("you"), s:me, me:true}]).sort((a, b) => b.s - a.s);
 $("viewBoard").innerHTML = '<div class="card"><h3>' + esc(t("segBoard")) + "</h3>"
  + rows.map((r, i) => '<div class="lbrow' + (r.me ? " me" : "") + '"><span class="lbrank" dir="ltr">' + num(i + 1) + "</span>"
   + '<span class="lbname">' + esc(r.n) + '</span><span class="lbpts" dir="ltr">' + num(Math.max(0, r.s)) + "</span></div>").join("")
  + "</div>" + '<div class="note">' + esc(t("simNote")) + "</div>";
}

/* ============================================================================
   SWAP AND REORDER — the thing that makes this a manager's game.
   Without it you could own Liverpool and never get it onto the pitch, because
   the picker files clubs in the order they were tapped. A bench club's only
   offered action was "make captain". That is not a squad, it is a receipt.
   ============================================================================ */
let _entryPlayed = false;
let _capDropped = false;
let swapFrom = null;                        /* index in `squad` currently armed for a swap */
function isStarter(i){ return i < START_SIZE; }
function swapArm(i){
 if(i == null || i < 0 || i >= squad.length || !squad[i]) return;   /* empty slots are not swappable */
 if(swapFrom === i){ swapFrom = null; render(); return; }      /* tap again to cancel */
 if(swapFrom === null){ swapFrom = i; render(); return; }
 swapSlots(swapFrom, i);
 swapFrom = null;
 render();
}
function swapSlots(a, b){
 /* BOTH indices must name a club the manager actually owns. The first version wrote to
    any index, so tapping an empty slot beyond the end of the squad extended the array
    with holes - and priceOf(undefined) charged 8.0M for a club that does not exist,
    which blocked every remaining club and made the squad impossible to complete. */
 if(a === b || a == null || b == null) return;
 if(a < 0 || b < 0 || a >= squad.length || b >= squad.length) return;
 if(!squad[a] || !squad[b]) return;
 const tmp = squad[a]; squad[a] = squad[b]; squad[b] = tmp;
 /* the captain must always be one of the eleven: a swap that benches him would leave the
    armband showing while silently paying nothing (measured: 67 -> 51 points) */
 /* Never silently reassign the armband. Benching the captain used to hand it to whatever
    club happened to occupy slot 0 - measured 8 silent reassignments in 200 swaps, once
    swinging a round by 17 points. Clear it and say so; the manager chooses. */
 if(captain && squad.indexOf(captain) >= START_SIZE){ captain = null; _capDropped = true; }
 save();
}
/* promote a substitute straight into the XI, replacing a chosen starter */
function promoteSub(subIndex, starterIndex){ swapSlots(subIndex, starterIndex); render(); }
function swapLabel(i){
 if(swapFrom === null) return "";
 if(swapFrom === i) return t("swapCancel");
 return isStarter(swapFrom) !== isStarter(i) ? t("swapHere") : t("swapWith");
}

/* ---------------- sheets ---------------- */
function clearArm(){ swapFrom = null; }
function openSheet(html){
 clearArm();
 $("sheetBox").innerHTML = '<button type="button" class="sx" onclick="closeSheet()" aria-label="' + esc(t("done")) + '">✕</button>' + html;
 $("sheet").classList.remove("hide");
 document.body.classList.add("gk-lock");
 $("sheetBox").focus({preventScroll:true});
}
function closeSheet(){ clearArm(); $("sheet").classList.add("hide"); document.body.classList.remove("gk-lock"); render(); }
$("sheet").addEventListener("click", e => { if(e.target === $("sheet")) closeSheet(); });

function openPicker(){
 swapFrom = null;
 pickFilter = "all";
 paintPicker();
 $("sheet").classList.remove("hide");
 document.body.classList.add("gk-lock");
}
function paintPicker(){
 const lgs = [{id:"all", ar:t("allLg"), en:t("allLg")}].concat(LEAGUES);
 const list = CLUBS
  .filter(c => pickFilter === "all" || c.lg === pickFilter)
  .sort((a, b) => priceOf(b.id) - priceOf(a.id));
 const rows = list.map(c => {
  const picked = squad.includes(c.id);
  const why = blockReason(c);
  return '<button type="button" class="clubrow' + (picked ? " on" : "") + '"' + (why ? " disabled" : "")
   + ' onclick="togglePick(\'' + esc(c.id) + '\')">'
   + kitHtml(c, "k34")
   + '<span class="crname"><span class="crn">' + esc(clubName(c)) + "</span>"
   + '<span class="' + (why ? "crwhy" : "crl") + '">' + esc(why || leagueName(c.lg)) + "</span></span>"
   + '<span class="crprice" dir="ltr">' + num(priceOf(c.id).toFixed(1)) + "M</span>"
   /* a blocked row must NOT show "+": it promises an action that cannot happen, which is
      what made the tester tap Liverpool repeatedly and conclude the app was broken */
   + '<span class="crpick">' + (picked ? "✓" : why ? "✕" : "+") + "</span></button>";
 }).join("");
 $("sheetBox").innerHTML =
  '<button type="button" class="sx" onclick="closeSheet()" aria-label="' + esc(t("done")) + '">✕</button>'
  + "<h2>" + esc(t("pickTitle")) + "</h2>"
  + budgetHtml()
  + '<div class="filters">' + lgs.map(l => '<button type="button" class="fchip' + (pickFilter === l.id ? " on" : "")
    + '" onclick="setFilter(\'' + esc(l.id) + '\')">' + esc(LANG === "ar" ? l.ar : l.en) + "</button>").join("") + "</div>"
  + rows
  + (squad.length === SQUAD_SIZE
     ? '<button type="button" class="btn" onclick="closeSheet();openCaptain()">' + esc(t("confirmSquad")) + "</button>"
     : '<button type="button" class="btn ghost" onclick="autoFill()">' + esc(t("autoPick")) + "</button>");
}
function setFilter(id){ pickFilter = id; paintPicker(); }
function togglePick(id){
 const i = squad.indexOf(id);
 if(i >= 0){ squad.splice(i, 1); if(captain === id) captain = null; }
 else{
  const c = CLUBS.find(x => x.id === id);
  if(blockReason(c)) return;
  squad.push(id);
 }
 save(); paintPicker();
}

/* a complete legal squad, built for the user, so step 3 of the wizard is never an empty board */
function autoFill(){
 const pool = CLUBS.slice().sort((a, b) => priceOf(b.id) - priceOf(a.id));
 while(squad.length < SQUAD_SIZE){
  let added = false;
  for(const c of pool){
   if(squad.includes(c.id)) continue;
   if(blockReason(c)) continue;
   squad.push(c.id); added = true; break;
  }
  if(!added) break;
 }
 save(); paintPicker();
}

function openClub(id){
 const c = CLUBS.find(x => x.id === id); if(!c) return;
 openSheet("<h2>" + esc(clubName(c)) + "</h2>"
  + '<div class="muted" style="margin-bottom:12px">' + esc(leagueName(c.lg)) + "</div>"
  + '<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">' + kitHtml(c, "k60")
  + '<div><div class="dim" style="font-size:12px">' + esc(t("priceLab")) + '</div>'
  + '<div style="font-size:22px;font-weight:900;color:var(--fx-gold)" dir="ltr">' + num(priceOf(id).toFixed(1)) + "M</div></div></div>"
  + (squad.includes(id) && squad.length === SQUAD_SIZE
     ? '<button type="button" class="btn" onclick="captain=\'' + esc(id) + '\';save();closeSheet()">' + esc(t("setCap")) + "</button>"
     : ""));
}

function openCaptain(){
 if(squad.length !== SQUAD_SIZE) return;
 const rows = squad.map(id => {
  const c = CLUBS.find(x => x.id === id); if(!c) return "";
  return '<button type="button" class="clubrow' + (captain === id ? " on" : "") + '" onclick="captain=\'' + esc(id) + '\';save();openCaptain()">'
   + kitHtml(c, "k34") + '<span class="crname"><span class="crn">' + esc(clubName(c)) + "</span>"
   + '<span class="crl">' + esc(leagueName(c.lg)) + "</span></span>"
   + '<span class="crpick">' + (captain === id ? "C" : "+") + "</span></button>";
 }).join("");
 openSheet("<h2>" + esc(t("capTitle")) + "</h2><div class='muted' style='margin-bottom:12px'>" + esc(t("capNote")) + "</div>"
  + rows + (captain ? '<button type="button" class="btn" onclick="closeSheet()">' + esc(t("done")) + "</button>" : ""));
}

/* the trust screen: never show a total without being able to explain it */
function openBreakdown(id, gw){
 const c = CLUBS.find(x => x.id === id); if(!c) return;
 const m = simMatch(id, gw);
 const isCap = id === captain;
 if(m.blank){
  openSheet("<h2>" + esc(clubName(c)) + "</h2><div class='muted'>" + esc(t("noPlay")) + "</div>");
  return;
 }
 const row = (lab, val, cls) => '<div class="ptsrow"><span class="dim">' + esc(lab) + '</span><span class="v ' + (cls || "")
   + '" dir="ltr">' + (val > 0 ? "+" : "") + num(val) + "</span></div>";
 const tierCol = ["","var(--t1)","var(--t2)","var(--t3)","var(--t4)","var(--t5)"][m.oppTier];
 openSheet("<h2>" + esc(clubName(c)) + "</h2>"
  + '<div class="muted" style="margin-bottom:10px">' + esc(t("gwTitle")) + " " + num(gw) + " · "
  + '<span dir="ltr">' + num(m.gf) + "–" + num(m.ga) + "</span></div>"
  + '<div class="card" style="margin-bottom:10px"><h3>' + esc(t("breakdown")) + "</h3>"
  + row(m.win ? t("bdWin") : m.draw ? t("bdDraw") : t("bdLoss"), m.res, m.res > 0 ? "pos" : "")
  + (m.clean ? row(t("bdClean"), m.clean, "pos") : "")
  + (m.goals ? row(t("bdGoals"), m.goals, "pos") : "")
  + (m.conc ? row(t("bdConc"), m.conc, "neg") : "")
  + (m.tierBonus ? row(t("bdTier"), m.tierBonus, "pos") : "")
  + (isCap ? row(t("bdCap"), m.pts, "pos") : "")
  + '<div class="ptsrow" style="border-top:1px solid var(--fx-line-2);margin-top:6px;padding-top:10px">'
  + '<span style="font-weight:900">' + esc(t("gwPts")) + '</span><span class="v" style="color:var(--fx-gold);font-size:17px" dir="ltr">'
  + num(m.pts * (isCap ? 2 : 1)) + "</span></div></div>"
  + '<div class="tier"><span>' + esc(t("tierLab")) + '</span><span class="tdot" style="background:' + tierCol + '"></span>'
  + '<span dir="ltr">T' + num(m.oppTier) + "</span> · <span>" + esc(t("tier" + m.oppTier)) + "</span></div>");
}

/* ---------------- help + glossary ----------------
   Arabic fantasy vocabulary does not exist in most fans' heads, so every term is
   given in Arabic with a plain one-line explanation, English underneath. */
/* The definition is a [ar, en] PAIR. It used to be a single Arabic string shown in both
   languages, so the entire English glossary rendered in Arabic. */
const GLOSSARY = [
 ["الجولة","Gameweek",["فترة بين إقفالين. كل ماتش تلعبه أنديتك جوّاها بيتحسب لك.",
   "The period between two deadlines. Every match your clubs play inside it counts for you."]],
 ["الكابتن","Captain",["نادي واحد بس في فريقك بياخد ضعف نقطه كل جولة.",
   "One club in your team scores double every round."]],
 ["الميزانية","Budget",["الـ 120 مليون اللي بتشتري بيها أنديتك. مش فلوس حقيقية.",
   "The 120M you buy your clubs with. Not real money."]],
 ["الانتقالات","Transfers",["تغيير نادي بنادي تاني بعد ما تبدأ.",
   "Swapping one club for another once the season is under way."]],
 ["شباك نظيفة","Clean sheet",["النادي خلّص الماتش من غير ما يدخل عليه أي هدف.",
   "The club finished the match without conceding a goal."]],
 ["مكافأة قوة الخصم","Opponent strength bonus",["لو نادي ضعيف كسب نادي كبير، بياخد نقط زيادة.",
   "A weaker club that beats a stronger one earns extra points."]],
 ["الجوكرات","Chips",["مزايا بتستخدمها مرتين في الموسم — واحدة في كل نص.",
   "Special advantages you can use twice a season — one in each half."]],
 ["تغيير شامل","Wildcard",["تغيّر فريقك كله مرة واحدة من غير خصم نقط.",
   "Rebuild your whole team once, with no points penalty."]],
 ["فريق مؤقت","Free Hit",["فريق لجولة واحدة بس، وبعدها يرجع فريقك الأصلي.",
   "A team for one round only; your original squad returns afterwards."]],
 ["مالوش ماتش","No fixture",["النادي مالوش ماتش في الجولة دي، فمش هياخد نقط.",
   "The club has no match this round, so it scores nothing."]]
];
/* الجوكرات - eight chips, two of each, expiring at the halfway deadline. The module owns
   every rule; this only supplies the ledger and the current round. */
let chipPlays = [];
function chipSave(){
 return {lang: LANG, plays: chipPlays, firstGw: 1, halfwayGw: 18, lastGw: 36, deadlinePassed: false};
}
function openChips(){
 if(typeof chipState !== "function") return;
 const st = chipState(chipSave(), CURRENT_GW);
 openSheet(chipsHtml(st));
 const box = $("sheetBox");
 box.onclick = function(e){
  const play = e.target.closest("[data-chip-play]");
  if(play){
   const id = play.getAttribute("data-chip-play");
   openSheet(chipConfirmHtml(chipState(chipSave(), CURRENT_GW).byId[id]));
   $("sheetBox").onclick = function(ev){
    const ok = ev.target.closest("[data-chip-confirm]");
    if(ok){ chipPlays.push({chip: id.split("-")[0], half: +id.split("-")[1], gw: CURRENT_GW, state:"active"}); openChips(); }
    else if(ev.target.closest("[data-chip-dismiss]")) openChips();
   };
   return;
  }
  const cancel = e.target.closest("[data-chip-cancel]");
  if(cancel){
   const id = cancel.getAttribute("data-chip-cancel");
   chipPlays = chipPlays.filter(x => (x.chip + "-" + x.half) !== id);
   openChips();
  }
 };
}
function openHelp(){
 openSheet("<h2>" + esc(t("rulesTitle")) + "</h2>"
  + '<div class="card"><h3>' + esc(t("wiz1h")) + '</h3><div class="dim" style="font-size:13px;line-height:1.7">' + t("wiz1p") + "</div></div>"
  + '<div class="card"><h3>' + esc(t("wiz2h")) + '</h3><div class="dim" style="font-size:13px;line-height:1.7">' + t("wiz2p") + "</div></div>"
  + '<div class="card"><h3>' + esc(t("glossTitle")) + "</h3>"
  + GLOSSARY.map(g => '<div class="gloss"><div class="gterm">' + esc(LANG === "ar" ? g[0] : g[1]) + '</div>'
    + '<div class="gen"' + (LANG === "ar" ? ' dir="ltr"' : "") + '>' + esc(LANG === "ar" ? g[1] : g[0]) + "</div>"
    + '<div class="gdef">' + esc(g[2][LANG === "ar" ? 0 : 1]) + "</div></div>").join("") + "</div>"
  + '<button type="button" class="btn" onclick="closeSheet()">' + esc(t("done")) + "</button>");
}

/* ---------------- coach marks: at most one per session, never repeated ---------------- */
let coachShownThisSession = false;
/* takes a STR KEY, not rendered text: passing the text froze the coach mark in whichever
   language happened to be active when it was first built */
function maybeCoach(key, anchorId, strKey){
 const text = t(strKey);
 if(coachShownThisSession || seenCoach[key]) return;
 const el = $(anchorId); if(!el) return;
 coachShownThisSession = true;
 seenCoach[key] = 1;
 try{ localStorage.setItem("fx_coach", JSON.stringify(seenCoach)); }catch(_){}
 const r = el.getBoundingClientRect();
 const c = $("coach");
 c.innerHTML = text + '<div class="cdo" onclick="$(\'coach\').classList.add(\'hide\')">' + esc(t("gotIt")) + "</div>";
 c.style.top = Math.min(window.innerHeight - 130, r.bottom + 8) + "px";
 c.style.insetInlineStart = "16px";
 c.classList.remove("hide");
}

/* ---------------- first-run wizard ----------------
   Target: a complete team in under 3 minutes, and the fast path is 8 taps because
   step 3 hands the user a finished squad instead of an empty board. */
/* ---------------- the tutorial ----------------
   The demo resets on every open, so this is the most-seen screen in the product. The
   module owns the content and the state machine; the host owns commit, focus and scroll.
   Every control carries data-tut-act — no inline handlers, because the module is pure. */
let TS = null;
function tutMount(){ $("wizBox").innerHTML = tutHtml(TS); }
function openWizard(){
 if(typeof tutInit !== "function"){ wizStep = 0; paintWizard(); }   /* bundle absent: fall back */
 else{
  /* `price` is a FUNCTION of club id, not a map. Passing the map silently fell through to
     the module's stub (() => 8), which made 15 clubs cost exactly 120.0M — the budget, to
     the decimal — so the squad looked perfectly legal and actually cost 201M. A default
     that happens to equal the right answer is the worst kind of default. */
  /* the tutorial said "Round 1" while the app ran at gameweek 6, and its closing step had no
     time on it, because neither was ever passed in */
  const gwFrom = ["الجمعة 21 أغسطس", "Fri 21 Aug"], gwTo = ["الأحد 23 أغسطس", "Sun 23 Aug"];
  TS = tutInit({clubs: CLUBS, price: priceOf, leagueName: leagueName, lang: LANG,
                size: SQUAD_SIZE, startSize: START_SIZE, budget: BUDGET,
                maxPerLeague: MAX_PER_LEAGUE, minPrice: MIN_CLUB_PRICE, seed: 20260816,
                gw: {no: CURRENT_GW, from: gwFrom, to: gwTo,
                     lock: ["الجمعة 8:30 مساءً", "Fri 8:30pm"],
                     fixture: ["أول ماتش", "first match"]}});
  tutMount();
 }
 $("wiz").classList.remove("hide");
 document.body.classList.add("gk-lock");
}
$("wizBox").addEventListener("click", function(e){
 const el = e.target.closest("[data-tut-act]");
 if(!el || !TS) return;
 TS = tutReduce(TS, {type: el.dataset.tutAct, arg: el.dataset.tutArg});
 if(TS.done){
  squad = TS.squad.slice(); captain = TS.captain; save();
  closeWizard(); return;
 }
 tutMount();
 const f = $("wizBox").querySelector("[data-tut-focus]");
 if(f) f.focus({preventScroll:true});
 $("wizBox").scrollTop = 0;
});
function closeWizard(){
 /* Re-arm the walk-out. boot() paints the pitch and then covers it with the wizard, so the
    entry sequence was being spent behind a z-index 120 modal — every run, since the demo
    resets on load. Nobody had ever seen it. It plays when the pitch is first REVEALED. */
 _entryPlayed = false;
 $("wiz").classList.add("hide");
 document.body.classList.remove("gk-lock");
 try{ localStorage.setItem("fx_onboarded", "1"); }catch(_){}
 render();
}
function wizNext(){ wizStep++; if(wizStep > 3) return closeWizard(); paintWizard(); }
function paintWizard(){
 const dots = '<div class="wizdots">' + [0,1,2,3].map(i => '<span class="wizdot' + (i === wizStep ? " on" : "") + '"></span>').join("") + "</div>";
 let body = "";
 if(wizStep === 0){
  body = '<div class="wizart">⚽</div><div class="wizh">' + esc(t("wiz1h")) + '</div><div class="wizp">' + t("wiz1p") + "</div>";
 } else if(wizStep === 1){
  body = '<div class="wizart">💰</div><div class="wizh">' + esc(t("wiz2h")) + '</div><div class="wizp">' + t("wiz2p") + "</div>";
 } else if(wizStep === 2){
  if(squad.length < SQUAD_SIZE) autoFill();
  body = '<div class="wizh">' + esc(LANG === "ar" ? "جهزنالك فريق" : "We built you a team") + "</div>"
   + '<div class="wizp">' + t("wiz3p") + "</div>" + budgetHtml() + pitchHtml(false)
   + '<button type="button" class="btn ghost" onclick="closeWizard();openPicker()">' + esc(t("changeTeam")) + "</button>";
 } else {
  if(!captain && squad.length) captain = squad[0];
  body = '<div class="wizart">🎖️</div><div class="wizh">' + esc(t("wiz4h")) + '</div>'
   + '<div class="wizp">' + esc(t("wiz4p")) + "</div>"
   + squad.map(id => { const c = CLUBS.find(x => x.id === id); if(!c) return "";
      return '<button type="button" class="clubrow' + (captain === id ? " on" : "") + '" onclick="captain=\'' + esc(id) + '\';save();paintWizard()">'
       + kitHtml(c, "k34") + '<span class="crname"><span class="crn">' + esc(clubName(c)) + "</span></span>"
       + '<span class="crpick">' + (captain === id ? "C" : "+") + "</span></button>"; }).join("");
 }
 $("wizBox").innerHTML = dots + body
  + '<button type="button" class="btn" onclick="wizNext()">' + esc(wizStep === 3 ? t("done") : t("next")) + "</button>"
  + (wizStep < 3 ? '<button type="button" class="btn ghost" onclick="closeWizard()">' + esc(t("skip")) + "</button>" : "");
 save();
}

function resetDemo(){
 squad = []; captain = null; swapFrom = null;
 try{ localStorage.removeItem("fx_squad"); localStorage.removeItem("fx_cap");
      localStorage.removeItem("fx_onboarded"); localStorage.removeItem("fx_coach"); }catch(_){}
 seenCoach = {}; coachShownThisSession = false;
 render(); openWizard();
}

function toggleLang(){
 clearArm();
 LANG = LANG === "ar" ? "en" : "ar";
 try{ localStorage.setItem("fx_lang", LANG); }catch(_){}
 paintChrome(); render();
 if(TS && !$("wiz").classList.contains("hide")){ TS = tutReduce(TS, {type:"LANG", arg: LANG}); tutMount(); }
 if(!$("sheet").classList.contains("hide")) closeSheet();
}

/* ---------------- boot ---------------- */
(async function boot(){
 try{
  const [cj, pj] = await Promise.all([
   fetch("clubs.json").then(r => r.json()),
   fetch("prices.json").then(r => r.json())
  ]);
  CLUBS = cj.clubs; LEAGUES = cj.leagues;
  for(const p of pj.clubs) PRICES[p.id] = p;
 }catch(e){
  document.querySelector(".wrap").innerHTML = '<div class="card">Could not load club data.</div>';
  return;
 }
 load();
 paintChrome();
 render();
 let onboarded = "";
 try{ onboarded = localStorage.getItem("fx_onboarded") || ""; }catch(_){}
 if(!onboarded) openWizard();
})();
</script>
